name: Release Image (GHCR)

# Build a moved-spine module's container image and push it to GitHub Container
# Registry (ghcr.io/collite/<module>:<version>). Cloned shape from kantheon's
# release-image.yml (SV-P0 S6 T1), retargeted to tatrman-server's module layout
# with the N1 rename folded in: image repository names are publish-adjacent, so
# they use FUNCTIONAL names (query, validate, …) per the J-v2 guardrail —
# personas are legal only in Helm *release* names + k8s labels, NOT image repos.
# `veles` is a SURVIVING persona and keeps its name.
#
# DORMANT THROUGH SV-P0: rename-before-publish is the phase invariant (plan
# §SV-P0) — nothing is published to any registry in SV-P0. This workflow only
# fires on a pushed `<module>/v*` tag or a manual dispatch; no such tag is pushed
# in SV-P0. Spine images publish for real at SV-P1 gate 3, at which point the
# Python lane's known Dockerfile breakage (see ⚑ below) must be fixed first.
#
# ⚑ KNOWN PRE-EXISTING GAP (S4 sweep blind spot, recorded in S6 findings): the
# Python Dockerfiles still COPY the old persona dir paths — services/nlp
# COPYs `services/kadmos/...`, workers/worker-polars COPYs `workers/steropes/...`
# — and nlp's uv.lock still carries `kadmos-service`. The Python lane below is
# structurally correct but will fail until those paths are renamed + uv.lock
# regenerated (SV-P1 image-publish work).
#
# Two triggers:
#   1. push of a per-module tag `<module>/v<X.Y.Z>` (e.g. `query/v0.9.0`)
#      -> builds just that module at that version.
#   2. workflow_dispatch -> pick a version and `all` or a space-separated subset.
#
# Lane is auto-detected from the module directory:
#   Kotlin (has build.gradle.kts, no pyproject) -> Jib (./gradlew :path:jib, multi-arch via CI=true)
#   Python (has pyproject.toml)                  -> Docker build with repo-root context (COPY shared/)
#
# Secrets:
#   GITHUB_TOKEN           - provided automatically; the FALLBACK for the GHCR push, and enough
#                            only for packages this workflow created itself (see the ⚑ on the
#                            GHCR login step — per-package Actions access is the whole story).
#   TATRMAN_PKG_USER/TOKEN - the GHCR push credentials when set, and the Collite/ttr-core
#                            GitHub Packages reader (org.tatrman:ttr-*, needed by Veles +
#                            Translate). Scopes: `read:packages` + `write:packages`.
#                            Still optional — unset, both uses fall back to GITHUB_TOKEN.

on:
  push:
    tags:
      - '*/v*'            # per-module image tags
      - '!shared/v*'      # shared libs are Maven artifacts, not images
      - '!shared-proto/v*'
      - '!server-libs/v*' # the Maven library publish tag (publish.yml) — not an image
      # The PyPI wheel tag (publish-python.yml) — not an image either. Without
      # this, every `ttr-nlp` release also started an image build that failed on
      # `could not resolve a buildable path for module 'python-nlp'`, so a
      # successful publish left a red X beside it. It cost nothing and published
      # nothing, which is worse than it sounds: a release lane that always shows
      # one failure is a release lane whose failures nobody reads.
      - '!python-nlp/v*'
      # The morphology snapshot tag (publish-morph.yml). It publishes DATA —
      # `cs.morph.snap` and its member files — and there is no module called
      # "morph" to build. Excluded for the same reason as `python-nlp/v*`: a
      # release lane that always shows one failure is a release lane whose
      # failures nobody reads.
      - '!morph/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v), e.g. 0.9.0'
        required: true
        default: '0.9.0'
      modules:
        description: '"all" for every deployable module, or a space-separated list (e.g. "query veles")'
        required: true
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: collite

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        shell: bash
        run: |
          set -euo pipefail

          # Exact name -> buildable path map for the deployable (k8s-overlay) set.
          # Names are the FUNCTIONAL image-repo names (== directory basenames);
          # veles is a surviving persona and stays veles.
          declare -A PATHS=(
            [veles]=services/veles
            [query]=services/query
            [translate]=services/translate
            [validate]=services/validate
            [dispatch]=services/dispatch
            [charon]=services/charon
            [lex-matcher]=services/lex-matcher
            [llm-gateway]=services/llm-gateway
            [nlp]=services/nlp
            # The NLP BACKENDS live one level deeper and publish as `nlp-<dir>`, so the
            # name is not the directory basename and the `find` fallback below (maxdepth 3
            # from services/) would resolve `nlp-stanza` to nothing. Mapped explicitly.
            # ⚑ morphodita and nametag3 are deliberately ABSENT: they bake a LINDAT model
            # from a DSpace URL this workflow has no secret for (and morphodita's is
            # CC BY-NC-SA). Build those with `just nlp-backend-image <name> <ver> push`.
            [nlp-stanza]=services/nlp/backends/stanza
            [nlp-spacy]=services/nlp/backends/spacy
            [golem-py]=services/golem-py
            [morph-studio]=services/morph-studio
            [chrono]=services/chrono
            [geo]=services/geo
            [money]=services/money
            [grounding-mcp]=services/grounding-mcp
            [resolver]=services/resolver
            [meta-mcp]=tools/meta-mcp
            [query-mcp]=tools/query-mcp
            [lex-matcher-mcp]=tools/lex-matcher-mcp
            [nlp-mcp]=tools/nlp-mcp
            [worker-postgres]=workers/worker-postgres
            [worker-mssql]=workers/worker-mssql
            [worker-polars]=workers/worker-polars
            [identity]=infra/identity
            [health]=infra/health
          )
          ALL="veles query translate validate dispatch charon lex-matcher llm-gateway nlp nlp-stanza nlp-spacy golem-py morph-studio chrono geo money grounding-mcp resolver meta-mcp query-mcp lex-matcher-mcp nlp-mcp worker-postgres worker-mssql worker-polars identity health"

          declare -a NAMES
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${{ github.ref_name }}"
            NAME=$(echo "$REF" | rev | cut -d'/' -f2- | rev)
            # -RELEASE is a tag-level marker only (2026-07-16, justfile sync) — this
            # module has no external registry beyond ghcr, so the marker gates
            # nothing here, but the pushed image tag must still be bare x.y.z.
            VERSION=$(echo "$REF" | rev | cut -d'/' -f1 | rev | sed 's/^v//; s/-RELEASE$//')
            NAMES=("$NAME")
          else
            VERSION="${{ github.event.inputs.version }}"
            if [ "${{ github.event.inputs.modules }}" = "all" ]; then
              read -r -a NAMES <<< "$ALL"
            else
              read -r -a NAMES <<< "${{ github.event.inputs.modules }}"
            fi
          fi

          ENTRIES=()
          for n in "${NAMES[@]}"; do
            [ -z "$n" ] && continue
            P="${PATHS[$n]:-}"
            if [ -z "$P" ]; then
              P=$(find services workers tools infra -maxdepth 3 -type d -name "$n" -print -quit 2>/dev/null || true)
            fi
            if [ -z "$P" ] || [ ! -d "$P" ]; then
              echo "::error::could not resolve a buildable path for module '$n'"
              exit 1
            fi
            ENTRIES+=("{\"name\":\"$n\",\"path\":\"$P\",\"version\":\"$VERSION\"}")
          done

          MATRIX="{\"include\":[$(IFS=,; echo "${ENTRIES[*]}")]}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Planned build matrix:"; echo "$MATRIX"

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect lane
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          P="${{ matrix.path }}"
          # Order matters, and the two existing tests come FIRST so no module that
          # builds today can change lane: every mapped path carries either a
          # build.gradle.kts or a pyproject.toml. The third lane is for a module
          # that is only a Dockerfile with a LOCAL context — the NLP backends —
          # which the kotlin default would have sent to Jib.
          if [ -f "$P/pyproject.toml" ]; then LANE=python
          elif [ -f "$P/build.gradle.kts" ]; then LANE=kotlin
          elif [ -f "$P/Dockerfile" ]; then LANE=dockerfile
          else LANE=kotlin; fi
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          echo "Module ${{ matrix.name }} ($P) -> $LANE @ ${{ matrix.version }}"

      # ⚑ GHCR PUSH CREDENTIALS — read this before "simplifying" it back to GITHUB_TOKEN.
      #
      # `packages: write` above grants the job token the *ability* to write packages; GHCR
      # then checks per-package access on top of that. A container package created by a
      # repo's Actions run is auto-linked to that repo with Write. A package created any
      # other way — a `docker tag`/`crane copy` from a laptop, say — is linked to NO
      # repository, and GITHUB_TOKEN gets a flat 403 on it forever. Retrying cannot help.
      #
      # That is not hypothetical here: the P(-1) rename put the renamed images in place by
      # copying them (so olymp could pin `ghcr.io/collite/lex-matcher` before this workflow
      # had ever published under that name), which left SEVENTEEN packages unpushable from
      # CI — every prefix-free name that has a `ttr-*` twin. It surfaced on 2026-08-06 when
      # `lex-matcher/v0.10.0` and `v0.10.1` both failed at `jib`, while `charon` — created by
      # this workflow, therefore linked — kept publishing fine.
      #
      # The PAT authenticates as a USER rather than as this repository, so per-package
      # Actions access does not apply to it and every package the owner can write is
      # reachable. GITHUB_TOKEN stays the fallback: it is enough for any package this
      # workflow created itself, which keeps the workflow runnable in a fork or with no
      # secrets configured. Same pair the Gradle step below already uses for Maven reads —
      # the PAT needs `write:packages` on top of the `read:packages` that step needs.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TATRMAN_PKG_USER != '' && secrets.TATRMAN_PKG_USER || github.actor }}
          password: ${{ secrets.TATRMAN_PKG_TOKEN != '' && secrets.TATRMAN_PKG_TOKEN || secrets.GITHUB_TOKEN }}

      # Both lanes need auth to the Collite/ttr-core GitHub Packages repo (the TTR
      # toolchain org.tatrman:ttr-*; the Kotlin jib compile and the Python proto
      # prep both resolve it). GITHUB_TOKEN is not auto-exported to env.
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v5
      - name: Gradle auth for Collite/ttr-core (TTR toolchain)
        env:
          GPR_USER: ${{ secrets.TATRMAN_PKG_USER != '' && secrets.TATRMAN_PKG_USER || github.actor }}
          GPR_TOKEN: ${{ secrets.TATRMAN_PKG_TOKEN != '' && secrets.TATRMAN_PKG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          printf 'gpr.user=%s\ngpr.token=%s\n' "$GPR_USER" "$GPR_TOKEN" >> ~/.gradle/gradle.properties

      # ---------- Kotlin (Jib) ----------
      - name: Build & push (Jib)
        if: steps.lane.outputs.lane == 'kotlin'
        env:
          CI: 'true'   # build files use this to emit a multi-arch (amd64+arm64) manifest
        run: |
          set -euo pipefail
          GRADLE_MODULE=":$(echo "${{ matrix.path }}" | sed 's#/#:#g')"
          # --stacktrace: jib reports a registry refusal as a one-line "perhaps you should
          # make sure you have permissions" and Gradle drops the cause without it, so a real
          # 403 arrives indistinguishable from a transient. The push credentials are the ones
          # the GHCR login step explains at length above.
          ./gradlew "${GRADLE_MODULE}:jib" --no-configuration-cache --stacktrace \
            -Djib.to.image="${REGISTRY}/${IMAGE_ORG}/${{ matrix.name }}:${{ matrix.version }}" \
            -Djib.to.auth.username="${{ secrets.TATRMAN_PKG_USER != '' && secrets.TATRMAN_PKG_USER || github.actor }}" \
            -Djib.to.auth.password="${{ secrets.TATRMAN_PKG_TOKEN != '' && secrets.TATRMAN_PKG_TOKEN || secrets.GITHUB_TOKEN }}"

      # ---------- Python (Docker, repo-root context) ----------
      - uses: actions/setup-python@v6
        if: steps.lane.outputs.lane == 'python'
        with: { python-version: '3.13' }
      - name: Install uv
        if: steps.lane.outputs.lane == 'python'
        run: pip install uv
      - name: Build & push (Python Docker)
        if: steps.lane.outputs.lane == 'python'
        shell: bash
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_ORG}/${{ matrix.name }}:${{ matrix.version }}"
          # The shared-proto Python package is COPYed by the Dockerfile from
          # shared/proto/build/python-package — generate it first.
          ./gradlew :shared:proto:preparePythonPackage --no-configuration-cache
          # Repo-root context: the Dockerfile COPYs shared/ and services/<x> from root.
          docker build -f "${{ matrix.path }}/Dockerfile" -t "$IMG" .
          docker push "$IMG"

      # ---------- Dockerfile-only, LOCAL context (the NLP backends) ----------
      # No repo-root context: these Dockerfiles COPY only what sits beside them
      # (`server.py`), and giving them the whole repo would ship it into the build.
      # The runner is amd64, so a plain `docker build` produces the arch the
      # cluster runs — no buildx/QEMU needed here (unlike the local recipe).
      - name: Build & push (Dockerfile, local context)
        if: steps.lane.outputs.lane == 'dockerfile'
        shell: bash
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_ORG}/${{ matrix.name }}:${{ matrix.version }}"
          docker build -t "$IMG" "${{ matrix.path }}"
          docker push "$IMG"
