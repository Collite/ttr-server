name: platform-question

on:
  push:
    branches: [master]
    tags: ['platform-question/v*']
    # Paths filter branch pushes; GitHub ignores paths for tag pushes.
    paths:
      - 'connectors/platform-question/**'
      - '.github/workflows/platform-question.yml'
  pull_request:
    branches: [master]
    paths:
      - 'connectors/platform-question/**'
      - '.github/workflows/platform-question.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -m unittest discover -s connectors/platform-question -v

  release:
    if: startsWith(github.ref, 'refs/tags/platform-question/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build archive and release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#platform-question/v}"
          git archive --format=tar.gz --prefix=platform-question/ \
            -o "platform-question-${VERSION}.tar.gz" "$GITHUB_REF:connectors/platform-question"
          # Extract only this connector's changelog entry, not other release lanes.
          python - "$VERSION" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path('CHANGELOG.md').read_text()
          match = re.search(r'^- \*\*platform-question ' + re.escape(sys.argv[1]) +
                            r'\b.*?(?=\n- |\n## |\Z)', text, re.M | re.S)
          if not match:
              raise SystemExit('missing platform-question changelog entry')
          pathlib.Path('platform-question-release-notes.md').write_text(match.group(0).strip() + '\n')
          PY
      - name: Validate from the extracted archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#platform-question/v}"
          package_dir="$(mktemp -d)"
          tar -xzf "platform-question-${VERSION}.tar.gz" -C "$package_dir"
          cd "$package_dir/platform-question"
          python3 -m venv .venv
          .venv/bin/pip install jsonschema==4.25.1
          .venv/bin/python -m unittest discover -s . -v
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#platform-question/v}"
          gh release create "$GITHUB_REF_NAME" "platform-question-${VERSION}.tar.gz" \
            --verify-tag --notes-file platform-question-release-notes.md
