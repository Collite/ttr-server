name: platform-question

on:
  push:
    branches: [master]
    paths:
      - 'connectors/platform-question/**'
      - '.github/workflows/platform-question.yml'
  pull_request:
    branches: [master]
    paths:
      - 'connectors/platform-question/**'
      - '.github/workflows/platform-question.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -m unittest discover -s connectors/platform-question -v
