name: tatrman-server-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual + nightly triggers for the heavy `helm-install` kind gate (SV-P4·S2·T7).
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  # Also the WIRE-COMPATIBILITY gate (RV-P2.1.T7). `:shared:proto:check` runs
  # ProtoCompatSpec, which diffs every in-repo proto against the checked-in baseline
  # `shared/proto/compat/wire-baseline.desc` and fails on anything that is not purely
  # additive (J-v2): a removed field, a re-used tag number, a renamed field (proto3 JSON
  # is name-keyed), a moved enum value. It rides this job deliberately rather than
  # arriving as a separate `buf` job — the check needs no tool the build does not already
  # have, and protoc is only available here through the Gradle plugin.
  # To accept a deliberate wire change: `just proto-baseline`, review, commit.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Authenticates to the `Collite/ttr-core` GitHub Packages repo for the TTR
      # toolchain (org.tatrman:ttr-*). A standing third-party dep (settings.gradle.kts).
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: build
        run: ./gradlew build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The real-dependency (Testcontainers) component tier.
  #
  # A SEPARATE job, deliberately, and not wired into `check`: the root build script
  # keeps `componentTest` out of the `test` source set on purpose, so that the unit
  # gate stays mocked-only and fast (it even fails if component classes leak onto the
  # unit classpath). The tier was always meant to run — it just never had a caller.
  #
  # Until this job existed, `./gradlew build` compiled these specs and ktlint linted
  # them, and nothing ran them: 30 specs across 9 modules (llm-gateway,
  # translate, validate, veles, geo, both workers, and two shared libs) were
  # written, maintained, and dark. Found while reviewing the PT arc, whose gateway
  # inspect surface has no other integration coverage.
  #
  # The tier was WRITTEN for this job — `testkit.CiOnly` reads "always runs in CI;
  # `CI` is set by GitHub Actions on a native amd64 runner" and gates the MSSQL spec
  # on it. The condition was right; nothing ever satisfied it.
  #
  # Needs Docker; ubuntu-latest has it. Images are public and pinned in
  # `testkit.Containers`: postgres:16-alpine, redis:7-alpine, wiremock:3.13.2, and —
  # only here, never on a dev laptop — mssql/server:2022-latest, which is a ~1.5 GB
  # pull with a 5-minute startup allowance. That one image is most of the budget
  # below. `just test-component` is the same command a developer runs locally, where
  # the MSSQL spec reports *skipped* rather than failing on Apple Silicon.
  component-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: extractions/setup-just@v2

      - name: component tier (Testcontainers)
        run: just test-component
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A container tier fails in ways the console line does not explain — a pull
      # timeout and a real assertion failure look identical from the outside.
      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-reports
          path: |
            **/build/reports/tests/componentTest/
            **/build/test-results/componentTest/
          retention-days: 7
          if-no-files-found: ignore

  # RG-P6.S2.T1 — the gating service-level conformance tier (the SV-P3 parity
  # instrument): the three service-level corpora (ENTITIES_ONLY resolver + Q-17
  # fuzzy + grounding hermetic), self-contained with NO DFP dependency. Green
  # required. See conformance/README.md.
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # RV-P4.4: `just conformance-service-level` now also drives the conversation tier
      # (`just test-py services/golem-py`), which is a uv project.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - name: conformance (service-level, gating)
        run: just conformance-service-level
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # RV-P4.1 — the Python unit gate for golem-py (ruff + mypy --strict + pytest).
  #
  # ⚑ Recon finding, recorded rather than quietly fixed: until this job, the repo had
  # NO Python tier in CI at all. `just lint-py` / `just test-py` existed and covered
  # `services/nlp` and `workers/worker-polars`, and nothing ever called them — the same
  # shape as the componentTest tier that was written, linted and dark until a job was
  # added for it. This job is deliberately scoped to golem-py: extending it to the two
  # older modules is a separate change with its own risk (their suites have never run
  # here, so a first run is a discovery exercise, not a gate).
  #
  # The suite is hermetic — no network, no cluster, no docker. It reads the resolver's
  # committed lattice goldens directly, which makes it a cross-language conformance
  # check on one corpus (RV-28): if the Kotlin core changes what it emits, this fails
  # the same day the Kotlin tier does.
  golem-py:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff
        working-directory: services/golem-py
        run: uv run ruff check .

      - name: mypy --strict
        working-directory: services/golem-py
        run: uv run mypy

      - name: pytest
        working-directory: services/golem-py
        run: uv run pytest -q

  # NLS-P0.T7 — the Python unit gate for the `ttr-nlp` wheel (ruff + pytest +
  # a real wheel build).
  #
  # Modelled on the golem-py job above rather than folded into it: these are
  # separate uv projects with separate locks, and one job per project keeps a
  # failure legible. No mypy step — unlike golem-py this module has no mypy
  # config, and adding one is a change with its own discovery cost.
  #
  # The build step is not ceremony. The wheel is a published artifact whose
  # packaging can break without a single test failing (a missing package-data
  # include ships a wheel that imports fine here and dies on pack load in a
  # cluster), so CI builds it on every PR and the publish workflow's content
  # checks are the second line, not the first.
  ttr-nlp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff
        working-directory: shared/libs/python/ttr-nlp
        run: uv run ruff check .

      - name: pytest
        working-directory: shared/libs/python/ttr-nlp
        run: uv run pytest -q

      # `uv build`, not `pipx run build` — see the note in publish-python.yml:
      # the `build` distribution provides only `pyproject-build`, so the pipx form
      # relied on the runner guessing an app name the package does not ship.
      - name: build the wheel
        run: uv build --wheel shared/libs/python/ttr-nlp

  # NLS-P8.2 — the Python unit gate for `ttr-morph` (the LM editorial toolchain:
  # paradigm engine, layer models, snapshot compiler).
  #
  # No wheel-build step, unlike `ttr-nlp` above, and the difference is the whole
  # point of ⚑LMP-D4: this package is never published, so there is no packaging
  # to break. What it produces is the *snapshot*, and `publish-morph.yml`
  # compiles and verifies that on its own lane.
  #
  # The job arrives one list later than the package. NLS-P8.1 wired the justfile
  # loops and left CI unwired, which is a suite that runs on one laptop.
  ttr-morph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff
        working-directory: shared/libs/python/ttr-morph
        run: uv run ruff check .

      - name: pytest
        working-directory: shared/libs/python/ttr-morph
        run: uv run pytest -q

      # The goldens are a frozen record of the paradigm tables (NLS-P8.1). This
      # catches a tables edit that changed a paradigm nobody meant to touch —
      # the test suite alone would pass, because the goldens are its oracle.
      - name: golden paradigms are current
        working-directory: shared/libs/python/ttr-morph
        run: uv run python tests/engine/golden/regen.py --check

  # NLS-P3.3 — the Python unit gate for `services/nlp` (ruff + pytest).
  #
  # ⚑ This job did not exist before NLS-P3. `golem-py` and the `ttr-nlp` wheel had
  # one; the nlp front did not, so its whole suite ran only on a developer's
  # machine. NLS-P3 put the pipeline surface, the lane degrade and the atomic pack
  # reload in this module — an ungated 162-test suite guarding a wire contract that
  # Themis, Echo and kantheon all speak is not a state to ship in.
  #
  # The component tier (`-m component`) stays out, matching the other Python jobs:
  # it needs backends up, and `component-test` above is where real-dependency
  # tiers live.
  nlp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff
        working-directory: services/nlp
        run: uv run ruff check .

      # A conftest regenerates the gitignored `org.tatrman.{nlp,common}.v1` stubs
      # from shared/proto before collection, so there is no separate codegen step
      # — and the contract-shape freeze (NLS-P3.1.T2) therefore runs against stubs
      # built from the .proto in this very commit, which is the point of it.
      - name: pytest
        working-directory: services/nlp
        run: uv run pytest -q

  # NLS-P9.3 — the Python unit gate for `services/morph-studio` (the LM editorial
  # service: working store, cascade, status machine, layer-file export).
  #
  # ⚑ Third time this repo has shipped a module whose suite ran only on a
  # laptop — `services/nlp` (NLS-P3.3) and `ttr-morph` (NLS-P8.2) were the first
  # two. This one arrives one list after the service, same as `ttr-morph` did.
  #
  # The component tier (`-m component`, alembic up and down against a real
  # Postgres) stays out, matching every other Python job here: it needs a
  # database daemon, and `component-test` is where real-dependency tiers live.
  morph-studio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff
        working-directory: services/morph-studio
        run: uv run ruff check .

      # `tests/test_openapi.py` is in here and is the codegen guard: it rebuilds
      # the OpenAPI document from this commit's app and fails if
      # `frontend/openapi.json` differs. That is what stops a backend change from
      # shipping a stale TypeScript client — the frontend job below would still
      # be green, because it type-checks against whatever is committed.
      - name: pytest
        working-directory: services/morph-studio
        run: uv run pytest -q

  # NLS-P9.3 — the FI-7 frontend. The only TypeScript in this repo.
  morph-studio-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/morph-studio/frontend/package-lock.json

      - name: install
        working-directory: services/morph-studio/frontend
        run: npm ci

      - name: type-check
        working-directory: services/morph-studio/frontend
        run: npm run type-check

      - name: vitest
        working-directory: services/morph-studio/frontend
        run: npm run test:unit

      # The bundle the backend serves. A type-check that passes and a build that
      # does not is a real combination (asset resolution, the vite config), and
      # the failure would otherwise surface at image-build time.
      - name: build
        working-directory: services/morph-studio/frontend
        run: npm run build-only

  # P2/RO-6 dependency rules (contracts §7). Passes trivially on the S1 skeleton;
  # its real bite is S4 once the spine services + protos have arrived.
  dependency-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: check dependency rules
        run: bash scripts/check-dependency-rules.sh

  # Naming gate (RV-P(-1), ⚑RV-6): the `ttr-` prefix (naming-gate-ok) was dropped
  # from every service/lib/tool/worker/infra module; this stops it creeping back. Only two
  # classes stay: upstream `org.tatrman:ttr-*` toolchain coordinates (a
  # third-party dep) and K8s namespace names. See scripts/check-name-prefix.sh.
  naming:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: check the legacy name prefix has not crept back
        run: bash scripts/check-name-prefix.sh

  # DCO gate (SV-P2·S2, RO-18): every non-merge commit in a PR must carry a
  # `Signed-off-by:` trailer (`git commit -s`). Agent-authored patches included —
  # the human submitter's sign-off carries the DCO. See CONTRIBUTING.md.
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: check Signed-off-by on every commit
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha is missing a Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo "DCO check failed — sign off every commit with 'git commit -s' (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "DCO: all commits signed off"

  # License-header gate (SV-P2·S1, RO-18): every tracked *.kt/*.kts/*.py/*.proto/*.ts
  # source file must carry `SPDX-License-Identifier: Apache-2.0` in its first 3 lines.
  # Generated (build/, **/generated/**, *_pb2*) and third-party scaffolds
  # (infra/backstage/** — "The Backstage Authors", Apache-2.0 upstream) are excluded.
  # `scripts/add-spdx.sh` applies the header idempotently.
  spdx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: enforce SPDX license headers
        run: bash scripts/check-spdx.sh

  # SV-P4·S2·T1 — the umbrella-chart gate. `helm lint` + a golden-template drift
  # check: scripts/helm-golden.sh vendors the file:// subchart deps (offline) and
  # diffs three pinned values fixtures (spine-only · everything · honest-degrade)
  # against committed golden output. A chart change not reflected in golden fails
  # here — regenerate with `scripts/helm-golden.sh` and review the diff. Helm is
  # pinned to match the version golden was generated with (output is version-sensitive).
  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.1
      - name: helm lint
        run: helm lint helm/tatrman-server
      - name: golden templates (drift check)
        run: scripts/helm-golden.sh --check

  # SV-P4·S2·T7 — the kind install gate. Proves the umbrella actually INSTALLS and a
  # light subset reaches Ready (not just templates). Heavy, so it does NOT run on every
  # PR — only on a `chart-install` label, manual dispatch, or the nightly schedule.
  # Subset + rationale: helm/tatrman-server/deploy/values-kind-ci.yaml. (If the
  # ghcr.io/collite/* images are ever made private, add a docker-registry pull secret
  # + imagePullSecrets here.)
  helm-install:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'chart-install')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.1
      - uses: helm/kind-action@v1
        with:
          cluster_name: ttr-umbrella-ci
      - name: install the umbrella + wait for the subset to be Ready
        run: |
          scripts/helm-deps.sh
          helm install ttr helm/tatrman-server -n ttr-umbrella --create-namespace \
            -f helm/tatrman-server/deploy/values-kind-ci.yaml --wait --timeout 8m
      - name: show state
        if: always()
        run: |
          kubectl -n ttr-umbrella get pods
          kubectl -n ttr-umbrella get deploy
