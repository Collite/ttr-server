name: Mirror base images (GHCR)

# Every image built here and in kantheon starts FROM a copy of a Docker official image kept in our own
# registry: the JVM services FROM `ghcr.io/collite/eclipse-temurin:21-jre` (every Jib module), the Python,
# Node and nginx images FROM `ghcr.io/collite/{python,debian,node,nginx}:<tag>` (every Dockerfile).
#
# Why: Docker Hub rate-limits anonymous pulls per IP (100/h), and GitHub-hosted runners share their IPs
# with everyone else's. Three releases cut together on 2026-10-09 all failed at Jib's base-image pull with
# `TOOMANYREQUESTS: You have reached your unauthenticated pull rate limit`. The release lanes already log
# in to GHCR, so a base image there costs no new secret.
#
# What: each line of IMAGES (`<name>:<tag>`, a Docker official image) is copied to
# `ghcr.io/collite/<name>:<tag>`, keeping only linux/amd64 + linux/arm64 (every platform our builds ask
# for) — the upstream index also lists Windows images, whose base layers need not be copyable.
#
# Sources — two public mirrors of the official images, each serving the byte-identical index (the same
# digest as Docker Hub's; checked for every line on 2026-10-09), and neither under Docker Hub's limit:
#   1. mirror.gcr.io/library/<name>              Google's Docker Hub cache — tried first.
#   2. public.ecr.aws/docker/library/<name>      ECR Public — anonymous ~1 request/s per IP. One copy
#      fires several manifest + blob requests at once, so back-to-back copies got `429 Too Many
#      Requests: Rate exceeded` (2026-10-09, the third image). Hence the fallback, not the first choice.
# Every copy is retried with a growing pause, and the images are spaced apart.
#
# An image whose copy already carries the source's platform images is SKIPPED: the weekly run only
# touches what upstream changed.
#
# When: on a change to this file (a new line takes effect on merge), weekly (so the moving tags pick up
# runtime and OS security patches the way the Docker Hub tags did), and by hand.
#
# ⛑ Pushed with this repo's GITHUB_TOKEN on purpose: a package CREATED by a run in this repository is
# linked to it, so this workflow can always update it. A package first pushed any other way (a laptop
# copy, a PAT) is linked to no repository, and GITHUB_TOKEN is then denied on it for good. The release
# lanes READ it through their own GHCR login (a member's PAT), so its visibility does not matter to them.
#
# Adding an image: append `<name>:<tag>` to IMAGES, merge, wait for this run, then point the FROM at
# `ghcr.io/collite/<name>:<tag>`.

on:
  push:
    branches: [master]
    paths: ['.github/workflows/mirror-base-images.yml']
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-base-images
  cancel-in-progress: false

env:
  TARGET: ghcr.io/collite
  # Every Docker Hub base the two repos build from — the Jib base, then the Dockerfile FROMs. One copy
  # serves both: ttr-server's Dockerfiles and kantheon's (metis, investment-door, the nginx frontends).
  IMAGES: |
    eclipse-temurin:21-jre
    python:3.13-slim-bookworm
    python:3.13-slim
    python:3.11-slim-bookworm
    debian:bookworm-slim
    node:24-slim
    node:24-trixie-slim
    node:22-alpine
    nginx:alpine

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy and verify
        run: |
          set -uo pipefail

          # "arch digest" per linux/amd64 + linux/arm64 platform image, sorted; empty if unreachable.
          digests() {
            docker buildx imagetools inspect --raw "$1" 2>/dev/null \
              | jq -r '.manifests[]? | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | "\(.platform.architecture) \(.digest)"' \
              | sort
          }

          # The first source that answers, with its platform digests. Retried: a 429 reads as "no answer".
          resolve_source() {
            local img="$1" attempt src d
            for attempt in 1 2 3 4; do
              for src in "mirror.gcr.io/library/${img}" "public.ecr.aws/docker/library/${img}"; do
                d=$(digests "${src}")
                if [ -n "${d}" ]; then echo "${src}"; return 0; fi
              done
              sleep $((attempt * 10))
            done
            return 1
          }

          failed=0
          while read -r img; do
            [ -z "${img}" ] && continue
            dst="${TARGET}/${img}"
            echo "::group::${img} -> ${dst}"
            if ! src=$(resolve_source "${img}"); then
              echo "::error::${img}: no source answered (mirror.gcr.io, public.ecr.aws)"; failed=1; echo "::endgroup::"; continue
            fi
            want=$(digests "${src}")
            if [ "$(digests "${dst}")" = "${want}" ]; then
              echo "✓ up to date (${src}): $(echo "${want}" | tr '\n' ' ')"; echo "::endgroup::"; continue
            fi
            copied=0
            for attempt in 1 2 3 4 5; do
              for s in "mirror.gcr.io/library/${img}" "public.ecr.aws/docker/library/${img}"; do
                if docker buildx imagetools create \
                     --platform linux/amd64 --platform linux/arm64 \
                     --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                     --annotation "index:org.opencontainers.image.description=Mirror of the Docker official image ${img} (linux/amd64, linux/arm64)" \
                     --tag "${dst}" "${s}"; then
                  copied=1; break 2
                fi
                sleep 5
              done
              echo "attempt ${attempt} failed — retrying"
              sleep $((attempt * 15))
            done
            # The copy is only useful if the platform images are the SAME images.
            if [ "${copied}" = 1 ] && [ "$(digests "${dst}")" = "${want}" ]; then
              echo "✓ copied: $(echo "${want}" | tr '\n' ' ')"
            else
              echo "::error::${img}: copy failed or ${dst} does not carry the platform images of ${src}"; failed=1
            fi
            echo "::endgroup::"
            sleep 5 # space the images apart (ECR Public's anonymous rate)
          done <<< "${IMAGES}"
          exit "${failed}"
