apiVersion: v2
name: meta-mcp
description: |
  The Kantheon meta-mcp wrapper — the MCP edge over the metadata (model-graph) service. Env-agnostic Helm chart: image, replicas, resources, telemetry endpoint and the
  downstream gRPC wiring to Metadata are all values. Per-environment values live in the deploying
  repo. Converted from the kustomize base/overlays, mirroring query-mcp (D2).
type: application
# Chart version: the packaging. appVersion tracks the default image tag.
version: 0.1.0
appVersion: "dev"
# Common Deployment/Service shape from the tatrman-service library chart (D1).
dependencies:
  - name: tatrman-service
    version: 0.1.0
    repository: "file://../../../shared/charts/tatrman-service"
