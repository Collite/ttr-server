server {
    port = "7262"
    port = ${?META_MCP_SERVER_PORT}
    shutdownUrlPath = "/shutdown"
}

metadata {
    # Phase 2.1 (fork) — meta-mcp gRPC target.
    # `metadata.host` / `metadata.port` are the metadata service's gRPC host/port;
    # defaults to the in-cluster service name. Override with `METADATA_GRPC_HOST`
    # and `METADATA_GRPC_PORT` to point at a dev cluster / port-forward.
    protocol = grpc
    protocol = ${?METADATA_PROTOCOL}
    host = "metadata"
    host = ${?METADATA_GRPC_HOST}
    port = "7261"
    port = ${?METADATA_GRPC_PORT}
    path = ""
}

# capabilities-mcp registration endpoint. Empty by default (warn-and-continue);
# a deployment overlay sets CAPABILITIES_MCP_URL to enable registration. Without this
# root block registerWithCapabilities() throws ConfigException$Missing when the env is unset.
capabilities-mcp {
    url = ""
    url = ${?CAPABILITIES_MCP_URL}
}

telemetry {
    enabled = false
    enabled = ${?OTEL_ENABLED_META_MCP}
    otlp {
        endpoint = "http://localhost:4317"
        endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    }
}
