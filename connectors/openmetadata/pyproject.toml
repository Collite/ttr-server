[project]
name = "ttr-connect-openmetadata"
version = "0.1.3"
description = "Project Tatrman exports into OpenMetadata (XM M-1-beta)"
readme = "README.md"
authors = [
    { name = "bora", email = "bora@post.cz" }
]
requires-python = ">=3.12"
dependencies = [
    # PyPI's 2.0.6.0 is PEP 440-equivalent to 2.0.6; uv.lock records the exact wheel.
    "openmetadata-ingestion==2.0.6",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
ttr-connect-openmetadata = "ttr_connect_openmetadata.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["om_live: requires disposable OM_URL and OM_TOKEN; skipped without both"]
# The SDK advertises a pytest plugin for its own integration tests. Keep our
# offline suite independent of its database connectors and optional plugins.
addopts = "-p no:pytest_openmetadata"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["metadata.*"]
follow_imports = "skip"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]
