syntax = "proto3";

// Forked from the predecessor platform at the fork point
//   (shared/proto/src/main/proto/com/tatrman/nlp/v1/nlp.proto).
// Fork Stage 2.3 (Nlp). Package + outer-class renamed com.tatrman.nlp.v1 →
// org.tatrman.nlp.v1; the Rule-6 messages=99 field re-targeted from
// com.tatrman.metadata.v1.ResponseMessage to the kantheon stand-in
// org.tatrman.common.v1.ResponseMessage. NLP wire shapes are otherwise
// unchanged (fork principle: wire shapes fork unchanged). themis/v1's nlp.v1
// import is swapped in Stage 2.6.
//
// RG-P1.S1 (Resolution & Grounding, workstream C): the `NlpService` gRPC
// binding is added — gRPC is now the service contract, REST mirrors it for
// dev/health only (contracts §1). Additive-only over the forked wire shapes:
// `BatchLemmatize` (RS-6), `GetStatus`/capability matrix (RS-7), `EngineVersion`
// `used[]` echo (S-1: model identity on the wire), and the `Tier` label.
//
// NLS (nlp-suite) additions — contracts.md §2; messages=99 Rule-6 slot on
// RunPipelineResponse. The annotation surface (§2.1), `RunPipeline` (§2.2),
// `ReloadPacks` (§2.3) and `StatusResponse` fields 3–5 (§2.4). Every addition is
// additive: no existing field number, name or type is touched, and
// `services/nlp/tests/test_contract_shapes.py` freezes the pre-NLS messages
// field-by-field so a later edit cannot quietly renumber one.
//
// ⚑ ONE PROTO WINDOW. The LM effort's `ReportToken` (cz-lemma contracts §6)
// rides this same batch by ruling ⚑LMP-D3 — deliberately, so `:shared:proto`
// takes one additive diff rather than two. Its servicer arrives at NLS-P9;
// until then the front answers `accepted=false` (LM-MORPH-007), which is the
// honest answer for a sink that is not wired rather than an UNIMPLEMENTED that
// a caller has to special-case.

package org.tatrman.nlp.v1;

import "org/tatrman/common/v1/response_message.proto";  // for ResponseMessage

option java_multiple_files = true;
option java_package = "org.tatrman.nlp.v1";
option java_outer_classname = "NlpProto";

// ---------------------------------------------------------------------------
// Shared enums
// ---------------------------------------------------------------------------

enum NlpOp {
  NLP_OP_UNSPECIFIED = 0;
  TOKENIZE = 1;
  SENTENCE_SPLIT = 2;
  LEMMATIZE = 3;
  POS_TAG = 4;
  DEP_PARSE = 5;
  NER = 6;
  DETECT_LANGUAGE = 7;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  NORMAL = 1;
  COMPARE = 2;
}

// RG-P1 (S-1): the pinning tier a routed (language, op) resolves to.
// SELF_HOSTED_PINNED = in-cluster backend launched with an explicit model id
// (conformant). REMOTE_UNPINNED = Lindat (dev/eval only; non-conformant for
// parity/determinism claims — surfaced as RG-NLP-002).
enum Tier {
  TIER_UNSPECIFIED = 0;
  SELF_HOSTED_PINNED = 1;
  REMOTE_UNPINNED = 2;
}

// ---------------------------------------------------------------------------
// Token-level structures
// ---------------------------------------------------------------------------

message Token {
  string text = 1;
  int32 char_start = 2;
  int32 char_end = 3;
  string lemma = 4;
  string upos = 5;           // Universal POS tag (UD standard)
  string xpos = 6;           // Language-specific POS tag
  map<string, string> feats = 7;  // Morphological features as key-value pairs
  int32 dep_head = 8;        // Index of head token (1-based); 0 = root
  string dep_relation = 9;   // UD dependency relation label
}

message Span {
  int32 char_start = 1;
  int32 char_end = 2;
}

message NerEntity {
  string text = 1;
  string label = 2;          // e.g. PER, LOC, ORG, DATE, MONEY, ...
  int32 char_start = 3;
  int32 char_end = 4;
  string normalized_value = 5;  // e.g. ISO date for DATE, typed amount for MONEY
  string source_engine = 6;     // Which engine produced this entity
}

// ---------------------------------------------------------------------------
// Per-engine result (used in COMPARE mode and as internal intermediate)
// ---------------------------------------------------------------------------

message EngineResult {
  repeated Token tokens = 1;
  repeated NerEntity entities = 2;
  repeated Span sentences = 3;
  repeated Span paragraphs = 4;
  string error = 5;          // non-empty if this engine failed for this request
}

// ---------------------------------------------------------------------------
// Request / Response
// ---------------------------------------------------------------------------

message AnalyzeRequest {
  string text = 1;
  string language = 2;                  // empty triggers DETECT_LANGUAGE
  repeated NlpOp ops = 3;
  Mode mode = 4;                        // default NORMAL
  map<string, string> engine_hints = 5;  // op-name → engine override
}

message AnalyzeResponse {
  string language = 1;
  double language_confidence = 2;
  string engine_used = 3;              // primary engine in NORMAL mode
  repeated Token tokens = 4;
  repeated Span sentences = 5;
  repeated Span paragraphs = 6;
  repeated NerEntity entities = 7;
  map<string, EngineResult> by_engine = 8;  // populated only in COMPARE mode
  string trace_id = 9;
  int64 elapsed_ms = 10;
  // RG-P1 additions (contracts §1). `detected_language` is the contract-named
  // echo of `language`; `used` is the S-1 model-identity channel — one entry
  // per op that ran, ALWAYS populated (never a blank model), so consumers get
  // cache keys + provenance and the RG-NLP-002/003 tiers are observable.
  string detected_language = 11;
  repeated EngineVersion used = 12;
  repeated org.tatrman.common.v1.ResponseMessage messages = 99;
}

// ---------------------------------------------------------------------------
// S-1 — model identity on the wire (contracts §6). Echoed on every
// model-touched response; no empty/default model anywhere.
// ---------------------------------------------------------------------------

message EngineVersion {
  string op = 1;             // the NlpOp this engine served (name form)
  string engine = 2;         // e.g. "morphodita", "nametag3", "stanza", "spacy"
  string model = 3;          // explicit model id — NEVER empty (S-1)
  string model_version = 4;  // backend-reported version / handle
}

// ---------------------------------------------------------------------------
// BatchLemmatize (RS-6 / C4-T2) — the throughput path for fuzzy's RG-P2 lemma
// axis. Shape sized by Q-11 (≤100k short strings; batches to the backend hop).
// ---------------------------------------------------------------------------

message BatchLemmatizeRequest {
  repeated string texts = 1;
  string language = 2;       // empty ⇒ langid detect, fallback = deployment default
}

message LemmaList {
  repeated string lemmas = 1;  // lemmas for one input text, in token order
}

message BatchLemmatizeResponse {
  repeated LemmaList results = 1;   // positional to BatchLemmatizeRequest.texts
  repeated EngineVersion used = 2;  // S-1
}

// ---------------------------------------------------------------------------
// GetStatus / capability matrix (RS-7). One row per routed (language, op),
// built from config + backend readiness — not hardcoded.
// ---------------------------------------------------------------------------

message StatusRequest {}

message Capability {
  string language = 1;
  NlpOp op = 2;
  string engine = 3;
  string model_version = 4;
  Tier tier = 5;
}

message StatusResponse {
  bool ready = 1;
  repeated Capability capabilities = 2;  // the capability matrix
  // NLS additions (contracts §2.4). `NER.cs` in the default lane has NO
  // capability row — it is unrouted, and that absence plus the NLS-NLP-011
  // response diagnostic IS the NL-14 explicit degrade. A row with an empty
  // engine would be the same information said less clearly.
  string lane = 3;                       // "default" | "option"
  repeated PipelineInfo pipelines = 4;
  PackState pack_state = 5;
  // LM (NLS-P9). Which morph snapshot is serving, and with which world overlays
  // — the question an operator asks first when a demo answers wrongly, and one
  // no capability row can carry (a row says an op is served, not by what
  // artifact). Field 6 only: fields 1–5 are untouched, which is the whole of
  // ⚑LMP-D3's additive rule.
  MorphState morph_state = 6;
}

// ---------------------------------------------------------------------------
// NLS-P3.1 — the annotation surface (contracts §2.1).
// ---------------------------------------------------------------------------

// A feature value. Explicit oneof (not google.protobuf.Struct): keeps
// Kotlin/Python codegen dependency-free and the value domain deliberately small
// (P-2 — features are data, not objects). Lists of scalars cover gazetteer
// multi-refs.
message FeatureValue {
  oneof kind {
    string string_value = 1;
    double number_value = 2;
    bool   bool_value   = 3;
    FeatureValueList list_value = 4;
  }
}

message FeatureValueList { repeated FeatureValue items = 1; }

message Annotation {
  uint64 id = 1;                          // unique within the document (gatenlp annid)
  string type = 2;                        // e.g. Token, Lookup, ORG, QueryPattern
  int32 char_start = 3;
  int32 char_end = 4;
  map<string, FeatureValue> features = 5;
}

message AnnotationSet {
  string name = 1;                        // "" = default set (gatenlp convention)
  repeated Annotation annotations = 2;
}

message AnnotatedDocument {
  string text = 1;
  repeated AnnotationSet annotation_sets = 2;
  map<string, FeatureValue> document_features = 3;   // e.g. language, pipeline, lane
}

// ---------------------------------------------------------------------------
// RunPipeline (contracts §2.2) — a sibling of Analyze, not a mode of it (S-3).
// Analyze answers "what are the tokens"; this answers "what did the rules make
// of them", and its response is a document rather than a token list.
// ---------------------------------------------------------------------------

message RunPipelineRequest {
  string text = 1;
  string language = 2;                    // empty ⇒ langid detect (as Analyze)
  string pipeline = 3;                    // named pipeline (config §7); REQUIRED
  // Optional output filter: return only these annotation sets/types (empty = all).
  repeated string include_sets = 4;
  repeated string include_types = 5;
}

message RunPipelineResponse {
  AnnotatedDocument document = 1;
  string language = 2;
  double language_confidence = 3;
  repeated EngineVersion used = 4;        // S-1: model identity, per engine op that ran
  repeated PhaseTrace phases = 5;         // one entry per executed phase (observability)
  string trace_id = 6;
  int64 elapsed_ms = 7;
  repeated org.tatrman.common.v1.ResponseMessage messages = 99;  // Rule-6 slot
}

message PhaseTrace {
  string phase = 1;                       // phase or step name (engine op / gazetteer / rule phase)
  string kind = 2;                        // "engine" | "gazetteer" | "rules"
  int32 annotations_added = 3;
  int64 elapsed_ms = 4;
}

// ---------------------------------------------------------------------------
// ReloadPacks (contracts §2.3, NL-15). Sources come from config, never from the
// request: a reload that could be pointed anywhere is a remote code-load with
// extra steps. Semantics are re-read everything, validate everything, and swap
// atomically only on full green — `applied=false` means the previous immutable
// snapshot is still serving, untouched.
// ---------------------------------------------------------------------------

message ReloadPacksRequest {}

message ReloadPacksResponse {
  bool applied = 1;                       // false ⇒ previous snapshot still serving
  string state_id = 2;                    // opaque id of the now-active snapshot
  repeated PackDiagnostic diagnostics = 3;
}

// Field-for-field the wheel's `ttrnlp.packs.diag.Diagnostic` (and the CLI's
// `--json` output). One shape, so a pack author reading a validation error and an
// operator reading a reload response are looking at the same text.
message PackDiagnostic {
  string source = 1;                      // dir/URL the pack/list came from
  string pack = 2;                        // pack id ("" for list files)
  string severity = 3;                    // INFO | ERROR
  string code = 4;                        // NLS-PACK-0xx (contracts §8)
  string message = 5;
}

message PipelineInfo {
  string name = 1;
  repeated string steps = 2;
}

message PackState {
  string state_id = 1;
  int32 packs_loaded = 2;
  int32 lists_loaded = 3;
  repeated PackDiagnostic diagnostics = 4;  // non-empty only when boot load failed
}

// ---------------------------------------------------------------------------
// LM (cz-lemma contracts §6, ⚑LMP-D3) — riding the same proto window.
// A world-scoped report that a token could not be resolved, or was resolved
// wrongly. `world` is REQUIRED because queues never cross worlds (LM-5/S-4), and
// `context_span` is opt-in per world config — a lemmatizer queue that collected
// surrounding text by default would be collecting user data by default.
// ---------------------------------------------------------------------------

message ReportTokenRequest {
  string world = 1;                 // REQUIRED; queues never cross worlds
  string token = 2;                 // REQUIRED; surface form
  string verdict = 3;               // "miss" | "resolved_wrong"
  string context_span = 4;          // OPT-IN per world config; else empty
  string language = 5;
}

message ReportTokenResponse {
  bool accepted = 1;                // false = queue sink disabled
}

// The loaded morph snapshot, as `GetStatus` reports it (LM contracts §5's
// `MorphStats`, on the wire). `diagnostics` reuses `PackDiagnostic` rather than
// declaring an `LM-MORPH-*` twin: the wheel's `LM-MORPH-*` codes extend the
// `NLS-PACK-*` family in the SAME five-field `Diagnostic` shape, deliberately
// (`ttrnlp.morph.diag`), so an operator reads one dialect for both halves.
message MorphState {
  string version = 1;               // the morph/v<x.y.z> the artifact declares
  string language = 2;
  int32 rows = 3;                   // core + separable members + overlays
  int32 forms = 4;                  // distinct surface forms answerable exactly
  repeated string worlds = 5;       // world overlays loaded, in load order
  string content_hash = 6;          // the core artifact's own hash
  int32 fold_collisions = 7;        // folded keys carrying more than one lemma
  repeated PackDiagnostic diagnostics = 8;  // non-empty only when the load FAILED
}

// ---------------------------------------------------------------------------
// Service (RG-P1.S1). gRPC is the contract; the REST mirror is dev/health only.
// NLS: the REST mirror gains NO pipeline surface (NL-16).
// ---------------------------------------------------------------------------

service NlpService {
  rpc Analyze        (AnalyzeRequest)        returns (AnalyzeResponse);
  rpc BatchLemmatize (BatchLemmatizeRequest) returns (BatchLemmatizeResponse);
  rpc GetStatus      (StatusRequest)         returns (StatusResponse);
  rpc RunPipeline    (RunPipelineRequest)    returns (RunPipelineResponse);   // NLS-P3
  rpc ReloadPacks    (ReloadPacksRequest)    returns (ReloadPacksResponse);   // NLS-P3
  rpc ReportToken    (ReportTokenRequest)    returns (ReportTokenResponse);   // LM (NLS-P9)
}
