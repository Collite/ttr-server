// SPDX-License-Identifier: Apache-2.0
syntax = "proto3";

package org.tatrman.fuzzy.v1;

option java_multiple_files = true;
option java_package = "org.tatrman.fuzzy.v1";
option java_outer_classname = "FuzzyProto";

service FuzzyService {
  rpc Match (MatchRequest) returns (FuzzyMatchResponse) {}
  // RG-P2.S2 (additive): N spans × M categories in ONE rpc (the resolver's
  // gate-spans call). Results are positional to `spans`.
  rpc BatchMatch (BatchMatchRequest) returns (BatchMatchResponse) {}
  // Category discovery + staleness (contracts §2).
  rpc GetStatus (FuzzyStatusRequest) returns (FuzzyStatusResponse) {}
  // RV-P1.4 T5 (additive, J-v2): ONE term, deliberately scoped — the resolver's lookup rung
  // (RV-33: deterministic, anchored, category-scoped, always eligible first) and the contract
  // P2.3's lookup rounds are written against. Distinct from BatchMatch, which is N spans of a
  // parsed question; this is a single term the caller already knows it is asking about.
  rpc Lookup (LookupRequest) returns (LookupResponse) {}
}

message BatchMatchRequest {
  repeated SpanQuery spans = 1;
  optional string locale = 2; // RS-11
}

message SpanQuery {
  string query = 1;
  repeated string categories = 2; // match across these; explicit-unknown ⇒ EMPTY (leak guard, per-slot)
  int32 limit = 3;
}

message BatchMatchResponse {
  repeated FuzzyMatchResponse results = 1; // positional to BatchMatchRequest.spans
}

message FuzzyStatusRequest {}

message FuzzyStatusResponse {
  bool ready = 1;
  string vocabulary_version = 2;      // snapshot hash + load stamp (S-1)
  repeated CategoryStatus categories = 3;
  repeated LoaderWarning warnings = 4; // B-T4: PK-skipped declared columns (RG-FUZ-001)
  LayerVersions layer_versions = 5;    // RV-39 (RV-P1.4)
  string engine_version = 6;           // LP-P0: effective fuzzy.match.version — "v1" | "v2"
}

message CategoryStatus {
  string category = 1;
  SourceTag source = 2;
  int32 size = 3;           // candidate count
  int64 loaded_at_epoch_ms = 4;
}

message LoaderWarning {
  string code = 1;          // e.g. "RG-FUZ-001"
  string category = 2;
  string message = 3;
}

message MatchRequest {
  string query = 1;
  optional string category = 2; // Optional filter by category
  optional string algorithm = 3; // Legacy single-algorithm selection (e.g. "LEVENSHTEIN", "JARO_WINKLER", "TATRMAN")
  int32 limit = 4; // Optional limit for number of results
  // Optional algorithm cascade. When non-empty it overrides `algorithm`:
  // the algorithms are tried in order and the first whose top-1 score meets
  // its min_score wins (precision-first, recall-fallback). If none qualify,
  // the last algorithm's best-effort results are returned.
  repeated AlgorithmSpec algorithms = 5;
}

// One step of an algorithm cascade: run `algorithm`, and treat it as the
// winner if its top candidate scores >= `min_score`.
message AlgorithmSpec {
  string algorithm = 1; // "LEVENSHTEIN" | "TATRMAN" | "JARO_WINKLER" | ...
  double min_score = 2; // cascade gate on the top-1 score (not an output filter)
}

message FuzzyMatchResponse {
  repeated FuzzyMatch matches = 1;
  bool is_error = 2;
  string error = 3;
  string matched_algorithm = 4; // Which algorithm produced these results (cascade winner / last tried)
  // RG-P2 additive (S-1): snapshot hash + per-category load timestamp of the
  // vocabulary that produced these results. Populated from RG-P2.S2 (refresh).
  string vocabulary_version = 5;
  // RV-39 (RV-P1.4): the layer tuple. Additive — `vocabulary_version` above is untouched.
  LayerVersions layer_versions = 6;
}

// RG-P2 (contracts §2, RS-15): how a candidate's category was sourced.
// RV-P1.4: widened to RV contracts §1's four layers (additive, J-v2 — existing values keep
// their numbers). MEMBER *is* RV's DATA; VOCABULARY is the pre-RV conflation of DECLARED and
// METADATA, kept for the fixture-stub source that cannot tell them apart.
enum SourceTag {
  MEMBER = 0;      // data value — candidate_id is a data PK (→ resolved_id). RV: DATA.
  VOCABULARY = 1;  // legacy: declared lexicon/valueLabels, undifferentiated
  DECLARED = 2;    // authored in the lexicon/ area or as TTR-M `def term` sugar
  METADATA = 3;    // harvested from model labels (displayLabel/labelPlural/aliases/valueLabels)
  LEARNED = 4;     // the estate overlay (RV-P7.3): what this estate's users taught it
}

// RV-39 — the layer-version tuple, echoed per S-1. Additive alongside the older opaque
// `vocabulary_version` string, which stays: the two answer different questions, and the old one
// bakes in the member load stamp so it moves on every refresh whether or not a layer changed.
message LayerVersions {
  string lexicon_artifact_hash = 1;               // CompiledLexicon.contentHash; "" when none loaded
  map<string, string> member_index_versions = 2;  // category → content-derived version
  optional string overlay_version = 3;            // ABSENT when no overlay is loaded — absence is the contract
}

// RG-P2 (S-4): confidence provenance — producer + scoring method + raw score.
message Provenance {
  string producer = 1;  // e.g. "fuzzy"
  string method = 2;    // the algorithm that scored it, e.g. "TATRMAN"
  double raw_score = 3;
  // RV-44 (RV-P3.0): the winning (norm, algorithm, distance) when a DECLARED matching profile
  // scored this row. Additive, and ABSENT on every other row — "no norm fired" and "the canonical
  // one fired" must not read alike. `raw_score` above stays the ENGINE's number even when the
  // declared score replaces `FuzzyMatch.score`, so the retrieval rating is never lost.
  optional string norm = 4;       // canonical | folded | lemma
  optional string algorithm = 5;  // exact | typos | tokens
  optional int32 distance = 6;    // set iff algorithm == "typos"
  // LP-P0 (fuzzy.match:v2, additive): how each matched query token matched, and the candidate
  // coverage C. Both ABSENT on a v1 row (method "TATRMAN"); a v2 row has method "TATRMAN_V2".
  repeated TokenHit token_hits = 7;
  optional double coverage = 8;
}

// LP-P0 — one matched query token. Positions are 0-based token indices on the winning axis.
message TokenHit {
  string query_token = 1;
  string candidate_token = 2;
  string kind = 3;          // exact | typo | prefix
  int32 distance = 4;
  int32 query_pos = 5;
  int32 candidate_pos = 6;
}

message FuzzyMatch {
  string candidate_id = 1;
  string candidate = 2;
  double score = 3; // Similarity score/distance
  string category = 4;
  // RG-P2 additive (response-side; the pinned MatchRequest is untouched):
  SourceTag source = 5;
  optional string target_ref = 6;  // set iff the candidate is vocabulary (→ lexicon target)
  Provenance provenance = 7;       // S-4
  // RV-32 (RV-P1.4): the AUTHORED match method — EXACT | TOKENS | TYPOS(n). A different axis from
  // Provenance.method, which is the algorithm that produced the score. Absent for member values:
  // nobody authored a method for a data value.
  optional string match_method = 8;
  // RV-32 (RV-P1.4 T4): TOKENS only — how far this candidate's target beat the best OTHER target
  // in the declared layer for this query. Negative when a better target exists. ABSENT for every
  // other method: absence means "no uniqueness decision applies here", which `0` would not.
  optional double uniqueness_margin = 9;
  // RV-32: false ⇒ the caller MUST NOT auto-bind this candidate (the margin is under the floor, or
  // another target won). Absent ⇒ no such decision was made — the pre-RV shape.
  optional bool auto_bindable = 10;
  // RV-38: what the target IS. The *kind* derives from this and is never stored. UNSPECIFIED for
  // member values — a data value points at nothing but itself.
  TargetClass target_class = 11;
}

// RV-38 — the target classes a declared term can point at (contracts §1, `Binding.target_class`).
// Values are prefixed because proto3 enum values are siblings in the ENCLOSING scope, not scoped to
// their enum: an unprefixed `MEMBER` here would collide with `SourceTag.MEMBER` above. (They are
// also different axes with the same word — SourceTag.MEMBER is RV's DATA layer, TargetClass MEMBER
// is a member of a model object.)
enum TargetClass {
  TARGET_CLASS_UNSPECIFIED = 0;       // member values and any source that carries no class
  TARGET_CLASS_MODEL_OBJECT = 1;      // er./db./md. object, at any attribute depth
  TARGET_CLASS_MEMBER = 2;            // a member of a model object — a value, not a structure
  TARGET_CLASS_OPERATOR = 3;          // an `op:` skill trigger (RV-35 — bodies never enter the matcher)
  TARGET_CLASS_GROUNDING_TRIGGER = 4; // a `ground:` slice — chrono | money | geo (RV-42)
  // LP contracts §3.2 — a `pred:` slice: starts_with | ends_with | contains | equals |
  // not_contains. The words that say HOW a quoted literal restricts its attribute, never WHICH
  // rows it selects. Like a grounding trigger it names a behaviour, so it is not a model object
  // and never gates a span's values (§3.4).
  TARGET_CLASS_STRING_PREDICATE = 5;
}

// RV-P1.4 T5 — the category-scoped lookup request. FROZEN as the P2.3 lookup-round contract.
message LookupRequest {
  string term = 1;
  // Category keys to search — for the compiled lexicon these are target refs (`md.measure.net`,
  // `op:trend`). EMPTY = every category: the deliberate cross-category lookup a rung uses before
  // it knows the target. An explicit-but-unknown category contributes nothing (the per-slot leak
  // guard) and comes back in `unknown_categories` rather than silently yielding zero hits.
  repeated string categories = 2;
  // Restrict to these target classes (RV-38). EMPTY = no class filter. Scoping by class is what
  // lets a rung ask "which operator is this?" without first enumerating the estate's operators.
  // Member values carry no class, so a class-scoped lookup excludes them — that is the point.
  repeated TargetClass target_classes = 3;
  // Replaces the AUTHORED method for this call (`EXACT` | `TOKENS` | `TYPOS(n)`) — the rung's
  // strict-first-then-widen pass. Applies ONLY to rows that carry an authored method: it must
  // never impose one on rows nobody authored, or a caller widening its declared layer would
  // narrow the estate's data layer.
  optional string method_override = 4;
  // <= 0 ⇒ 10, and CAPPED AT 200 — the rung's question is bounded by construction, and an uncapped
  // int32 would let one request ask for the whole estate scored and serialised. A caller that needs
  // a wider answer narrows its `categories` instead; that is the scoping this surface is for.
  int32 max_candidates = 5;
}

// Failure is signalled by gRPC STATUS, not by an in-band flag: INVALID_ARGUMENT for a malformed
// request (e.g. an unparseable `method_override`), INTERNAL for a fault on the server. This is
// deliberately unlike FuzzyMatchResponse's legacy `is_error` — a status tells a caller whether
// retrying can help, which a bool and a string cannot.
message LookupResponse {
  repeated FuzzyMatch candidates = 1;
  LayerVersions layer_versions = 2;             // RV-39, per S-1
  string vocabulary_version = 3;                // the older opaque string, unchanged
  // Echoed back so a response is self-describing: the candidates carry their AUTHORED method, and
  // without this a reader cannot tell which method actually decided admission.
  optional string applied_method_override = 4;
  // Requested categories absent from the loaded vocabulary. Naming them turns "no candidates" into
  // a diagnosable answer — a stale ref and a genuine miss are indistinguishable otherwise.
  repeated string unknown_categories = 5;
}
