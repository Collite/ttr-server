# Default values for resolver (RG-P5/P6 · the deterministic resolve core + the
# `resolve.bind:v1` MCP door). Env-agnostic: sane defaults, NO cluster knowledge. Deploying
# environments override image, telemetry, the nlp/fuzzy gRPC targets, and the resume-token keys.

replicaCount: 1

image:
  repository: ghcr.io/collite/resolver
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# HTTP port (probes + REST) and gRPC port (the resolve RPC). Container ports match
# services/resolver/src/main/resources/application.conf.
ports:
  http: 7275
  grpc: 7276

# The `resolve.bind:v1` MCP door. Loopback by default (RG-P6 review D: the door decodes but
# does NOT signature-verify the OBO JWT, so it must not be off-host-reachable unless a
# deployment fronts it with an auth-terminating ingress and sets host=0.0.0.0). require-identity
# is H-2 fail-closed (a call with no resolvable OBO identity is refused). trust-network=false is
# TOKEN-ONLY (X-User-Id header / user_id arg / admin: role convention all ignored). NOT exposed
# as a Service port — reach it via port-forward or an ingress the deploying env adds.
mcp:
  port: 7277
  host: "127.0.0.1"
  requireIdentity: true
  trustNetwork: false

service:
  type: ClusterIP

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: "1"

# ⚑ Set `otlpHost` (NOT `endpoint`) — the shared otel-config lib builds the URL from a host and a
# port and never reads OTEL_EXPORTER_OTLP_ENDPOINT. `endpoint` is kept for back-compat only and
# reaches nothing; see the note in templates/_env.tpl. Typically:
#   telemetry: { enabled: true, otlpHost: mon-alloy.monitoring.svc.cluster.local, otlpGrpcPort: 4317 }
telemetry:
  enabled: false
  otlpHost: ""
  otlpGrpcPort: 4317
  endpoint: ""  # DEPRECATED — unread by the exporters
  serviceName: resolver

# nlp — the parse (Analyze) + capability matrix (GetStatus). ZERO LLM here.
nlp:
  host: nlp
  grpcPort: 7226
  deadlineSeconds: 30

# lex-matcher — the vocabulary matcher (BatchMatch). One RPC per resolve (B-T1).
fuzzy:
  host: fuzzy
  grpcPort: 7266
  deadlineSeconds: 30

# HMAC resume-token keys (RS-26 / S-3). `activeKeyId` signs new tokens; the key material is
# injected via secretEnv (RESOLVER_RESUME_KEY_<ID>). An empty key set is FAIL-CLOSED — the
# service refuses to boot — unless `allowEphemeralKey: true` (local/test only: the ephemeral
# per-process key breaks stateless resume across replicas/restarts, RG-P6 review L).
resumeToken:
  activeKeyId: ""
  maxAgeSeconds: 3600
  allowEphemeralKey: false

# Secret-backed env (valueFrom.secretKeyRef) — the resume-token key material for prod, e.g.
#   - { name: RESOLVER_RESUME_KEY_K1, secretName: resolver-resume-keys, secretKey: k1 }
secretEnv: []

# ✅ Q-7 — the compiled lexicon archive, the DECLARED-VOCABULARY channel (RS-24: one channel,
# two consumers). Identical shape to `services/lex-matcher/k8s/values.yaml`, deliberately: it is
# the SAME ConfigMap, rendered once by the deploying context out of the estate's
# `generated/lexicon.tar.zst`, and mounted into both readers. The library chart already renders
# the volume and the mount from these three keys — only the env var below is per-service.
#
# OFF by default, and that is the same posture the service code takes: an empty `configMapName`
# renders no volume, no mount and no `RESOLVER_LEXICON_ARCHIVE_PATH`, and the resolver then runs
# with an EMPTY declared vocabulary — which is what every deployment did before Q-7.
#
# ⚠ Turning it on is a BEHAVIOUR CHANGE, not just a config one: a fed registry makes the gate ask
# lex-matcher category-scoped questions instead of open ones, and wakes `SpanProposal`'s anchored
# path. That is the precision path Q-20 built and it is the point of feeding it — but an estate
# should adopt it deliberately, watching its own corpus, rather than inherit it from a chart bump.
#
# ttr-server#209 — SEVERAL archives, one per source the estate's packages come from (e.g. a second
# git source Metadata serves through `METADATA_GIT2_*`). List the extra ConfigMaps in `configMapNames`;
# `configMapName` stays the first (and may be left as it is). Each extra one is mounted beside the
# first at `<mountPath>.d/<configMapName>/<key>`, and the env then carries BOTH the singular var
# (the FIRST archive — an image older than the list key boots on it) and the list var (every
# archive, comma-separated), which the service loads as ONE declared layer. A single archive renders
# exactly as before. The FIRST archive is the primary; a later one that is broken, absent or on
# another schema than the primary's is skipped by the service (or served from its last good copy)
# and costs only its own words. ⚠ Every named ConfigMap must still EXIST: a missing one holds the pod
# in ContainerCreating (the volume is not optional), which keeps the old pods serving and makes the
# deploy error visible instead of quietly serving fewer words.
lexicon:
  configMapName: ""
  configMapNames: []
  key: lexicon.tar.zst
  mountPath: /etc/tatrman/lexicon

# Any other env (a deploying env REPLACES this list).
extraEnv: []

readinessProbe:
  path: /ready
  initialDelaySeconds: 2
  periodSeconds: 3
  failureThreshold: 20
livenessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
