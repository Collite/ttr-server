# Frame-role preposition tables (RV-P2.1.T5, Q-15 report handoff item 3).
#
# These are PER-LANGUAGE DATA, deliberately not Kotlin source: "the next language is a
# data change", and the P0.2 report says so in as many words. An estate may replace the
# whole file with `resolver.frame-roles.config-path` (env RESOLVER_FRAME_ROLES_PATH) —
# the same override shape lex-matcher and the grounding kernels use for their archive.
#
# The rules that read them (deriver precedence R3/R4) are in FrameRoles.kt. Only these
# tables are language-specific; every other rule reads the dep relation, the lemma
# and the binding's object kind, all of which are language-neutral.
#
# MH added a THIRD table, `count-heads`, read by `SlotHints` before binding rather than by
# `FrameRoles` after it — same argument for being data (RV-40), different consumer. See
# `docs/resolver-slots-and-equivalence.md`.

frame-roles {
    # Prepositions that introduce a GROUPING axis ("by X").
    #
    # The measure exception lives in the rules, not here: `podle` is GROUP-BY in
    # "tržby podle prodejen" and ORDER-BY in "prvních 10 stanic podle tržby" — same
    # preposition, opposite roles — and what separates them is whether the governed
    # mention binds a MEASURE. A table cannot express that, so it does not try.
    grouping-preps {
        cs = ["podle", "dle"]
        en = ["by"]
    }

    # Prepositions that introduce a restriction. Deliberately broad: in questions of
    # this shape a prepositional phrase that is not a grouping is almost always a filter.
    filter-preps {
        cs = ["v", "ve", "na", "za", "do", "od", "s", "se", "po", "při", "mezi",
              "před", "pod", "nad", "u", "o", "k", "ke", "pro", "z", "ze", "kolem"]
        en = ["in", "at", "on", "for", "during", "from", "of", "with", "to",
              "into", "over", "within"]
    }

    # Prepositions that read "per X" (GROUPING) before some nouns and "after X" (FILTER) before
    # others — Czech `po`: „tržby PO MĚSÍCÍCH“ is by month, „tržby PO ROCE 2020“ is after 2020.
    # Listed here, they stay in `filter-preps` too: the rule (FrameRoles, "distributive") reads
    # two independent signals for a mention that is neither a grounding trigger nor a member,
    # and keeps FILTER when neither speaks:
    #   A — the estate declared the preposition as part of the phrase (`po měsících`) and no
    #       value hangs on it: the estate named a breakdown;
    #   B — the governed noun's grammatical number: plural reads per-X, singular reads after-X.
    # They agree → that role. One silent → the other's. They DISAGREE → the mention carries BOTH
    # GROUPING and FILTER, the resolver's "undecided", and the consumer routes it to a reader
    # that can weigh the sentence (golem: the LLM lane). A config without the key never fires it.
    distributive-preps {
        cs = ["po"]
    }

    # MH — lemmas of count quantifiers that govern (or sit beside) a counted noun.
    #
    # New with the slot-aware Binder: "kolik" was a STOPWORD and nothing else in the system
    # had ever looked at a count head. The slot it identifies prefers an `entity` over a
    # fact — you count things, not measurements — which is what makes "Kolik máme prodejen?"
    # bind the store DIMENSION where the word is also a channel alias.
    #
    # Same shape as the two tables above, and the same reason for being data: the next
    # language is a data change. A config file that predates MH has no `count-heads` key at
    # all, which reads as empty sets and simply never fires the slot.
    count-heads {
        cs = ["kolik", "počet", "množství", "kolikrát"]
        en = ["many", "number", "count"]      # "how MANY", "NUMBER of", "COUNT of"
    }

    # Which table an unlisted language borrows. `en` is the thinner, more conservative
    # pair — a wrong FILTER costs a spurious restriction, and inheriting the Czech table
    # for, say, Polish would fire on words that are not prepositions there at all.
    default-lang = "en"
}
