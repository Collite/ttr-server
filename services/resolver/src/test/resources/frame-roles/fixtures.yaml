  - id: hl-operators-only-cs
    lang: cs
    world: hartland
    source: fresh
    text: "Porovnej to s loňskem"
    hard_classes: [operator-roleless, no-bound-subject, conversation-reference]
    note: >
      A follow-up turn. "to" is a CONVERSATION reference that never reaches the
      deterministic core (RV-34: conversation machinery keeps positional/view refs).
      There is no model-bound subject in this question at all — the correct output is
      an operator with no role and nothing else. Guards against a deriver that always
      names some SUBJECT.
    model:
      "md.dimension.Calendar.year": {isAttribute: true}
    mentions:
      - span: "Porovnej"
        binding: {ref: "op:compare", target_class: OPERATOR}
        roles: []
      - span: "loňskem"
        binding: {ref: "md.dimension.Calendar.year", target_class: MODEL_OBJECT}
        roles: [FILTER]

