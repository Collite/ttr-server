  - id: h2-cs
    lang: cs
    world: dfp
    source: "issues.md §Not admitting not knowing the entity (2026-07-28) + design.md H2"
    text: "Zobraz prvních 10 čerpacích stanic v Praze podle tržby za 12 měsíců."
    hard_classes: [operator-roleless, top-n, unbound-subject, filter-only-mention, podle-is-order-by]
    note: >
      TWO traps. (1) "čerpacích stanic" binds to NOTHING in this estate (it is a
      customer-category member the model never declared) — yet it is the SUBJECT, and
      that is exactly why the ask should fire on it (RV-15). The live Resolver instead
      forced "Praze" into cost-centre columns and never admitted ignorance.
      (2) "podle tržby" here is ORDER-BY, not GROUP-BY — the naive "podle + genitive
      -> GROUPING" rule is wrong whenever a top-n operator is present.
    model:
      "md.measure.revenue": {isAttribute: true, listedAsMeasure: true}
      "md.dimension.Calendar.month": {isAttribute: true}
    mentions:
      - span: "Zobraz"
        binding: {ref: "op:show", target_class: OPERATOR}
        roles: []
      - span: "prvních 10"
        binding: {ref: "op:top-n", target_class: OPERATOR}
        roles: []
      - span: "čerpacích stanic"
        binding: null
        gap_kind: G1_UNBOUND
        roles: [SUBJECT]
      - span: "Praze"
        binding: null
        gap_kind: G3_UNATTRIBUTED
        roles: [FILTER]
      - span: "tržby"
        binding: {ref: "md.measure.revenue", target_class: MODEL_OBJECT}
        roles: [MEASURE]
      - span: "měsíců"
        binding: {ref: "md.dimension.Calendar.month", target_class: MODEL_OBJECT}
        roles: [FILTER]
    values:
      - {span: "12", anchor: "měsíců"}

