# RV-P0.2 · Q-15 — frame-role derivation fixtures
#
# 25 Czech + 10 English questions with per-mention GOLD frame roles.
# Authored 2026-08-02 (RV-P0.2·T1) BEFORE any deriver existed — these are the bar,
# not a description of what some code happens to do.
#
# Sources (per the task list): the heroes H1/H1'/H2/H5 (design.md §heroes), the two
# live-Resolver failures in issues.md (2026-07-28), and fresh variants over the
# hartland_cz model (Collite/ttr-demo `model/md/*.ttrm` + `model/lexicon/cs/*.ttrm`
# — refs below are real model refs, and several question texts are lifted verbatim
# from `model/lexicon/cs/examples.ttrm`).
#
# ---------------------------------------------------------------- role semantics
# SUBJECT   what the question is ABOUT. Load-bearing (RV-15: asks fire on
#           load-bearing gaps only) — this is the role the spike's bar is set on.
# MEASURE   the quantity being aggregated.
# FILTER    restricts the result set.
# GROUPING  the by-axis.
# (none)    the mention carries no frame role. Operator mentions are ALWAYS this
#           (RV-35: operators are evidence to intent classification, never a role).
#
# A mention may carry TWO roles: `roles: [SUBJECT, MEASURE]` is the "measure-as-
# subject" class, and it is common. ⚑ NOTE FOR p2-1: `contracts.md` §1 declares
# `FrameRole frame_role = 4` — a SINGULAR field — which cannot express this. See
# report.md §"Contract finding".
#
# ------------------------------------------------------------------- gold policy
# * `roles` is the gold label set for that mention. `[]` means "no role", which is
#   a scoreable answer, not a missing label.
# * `binding: null` = the mention is a G1 gap (nothing in the model binds it). Its
#   gold role still stands — that is the whole point of RV-15: an unbound SUBJECT
#   is what makes an ask worth firing.
# * `values` are ValueFindings, not Mentions. They carry no roles of their own; they
#   are listed so the deriver can be tested on the anchor rule ("an anchored value's
#   anchor mention inherits SUBJECT-candidacy").
# * `occurrence` disambiguates a surface string that appears more than once.
#
# world: dfp      = the DFP/ucetnictvi world the heroes and issues.md come from.
#        hartland = hartland_cz, the ecosystem-standard fixture estate (BM-10).

schema: rv-frame-roles-fixtures/v1
authored: 2026-08-02
spike: RV-P0.2 (Q-15)
targets:
  subject_precision: 0.85    # the bar
  other_roles_recall: 0.70

fixtures:

  # ============================================================ heroes & regressions

  - id: h1-cs
    lang: cs
    world: dfp
    source: "design.md H1 + issues.md §Looking in wrong entity (2026-07-28)"
    text: "Zobraz náklady účtu 501001 v roce 2025 podle období"
    hard_classes: [operator-roleless, measure-as-subject, grouping-podle, anchored-value]
    note: >
      The live Resolver bound 501001 to the cost-centre entity because "účtu" was
      discarded as a "noun hint". Frame roles are the structural fix: účtu is the
      FILTER axis that anchors the value.
    model:
      "md.measure.cost": {isAttribute: true, listedAsMeasure: true}
      "md.dimension.Account": {isAttribute: false}
      "md.dimension.Calendar.year": {isAttribute: true}
      "md.dimension.Calendar.month": {isAttribute: true}
    mentions:
      - span: "Zobraz"
        binding: {ref: "op:show", target_class: OPERATOR}
        roles: []
      - span: "náklady"
        binding: {ref: "md.measure.cost", target_class: MODEL_OBJECT}
        roles: [SUBJECT, MEASURE]
      - span: "účtu"
        binding: {ref: "md.dimension.Account", target_class: MODEL_OBJECT}
        roles: [FILTER]
      - span: "roce"
        binding: {ref: "md.dimension.Calendar.year", target_class: MODEL_OBJECT}
        roles: [FILTER]
      - span: "období"
        binding: {ref: "md.dimension.Calendar.month", target_class: MODEL_OBJECT}
        roles: [GROUPING]
    values:
      - {span: "501001", anchor: "účtu"}
      - {span: "2025", anchor: "roce"}

