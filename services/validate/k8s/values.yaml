# Default values for validate. Env-agnostic: sane defaults, NO cluster knowledge. Deploying
# environments (Olymp cluster values, or test-context values) override image, telemetry,
# and the downstream wiring in extraEnv.

replicaCount: 1

image:
  repository: ghcr.io/collite/validate
  # Defaults to .Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The service listens on an HTTP port and a gRPC port (other constellation services call it
# over gRPC). These are the container ports AND the service ports AND the probe target.
ports:
  http: 7285
  grpc: 7286

service:
  type: ClusterIP

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: "1"

# OpenTelemetry. These services read a single OTLP endpoint URL (OTEL_EXPORTER_OTLP_ENDPOINT)
# plus the per-service OTEL_ENABLED_VALIDATE flag. Point `endpoint` at a collector (e.g. the
# cluster's Alloy) and set enabled; leave disabled where no collector exists (e.g. test runs).
telemetry:
  enabled: false
  # e.g. http://alloy.observability.svc.cluster.local:4317
  endpoint: ""
  serviceName: validate

# Downstream constellation wiring + any other env. Defaults match the constellation's stable
# in-cluster service names (env-agnostic — every cluster names them the same). A deploying
# env REPLACES this list to retarget (e.g. a test context points the LLM upstream at WireMock).
extraEnv:
  - { name: VELES_HOST, value: "veles" }
  - { name: VELES_GRPC_PORT, value: "7261" }

# Probes (HTTP on the http port).
readinessProbe:
  path: /ready
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30
livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 15

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# A per-deployment HOCON overlay, mounted and handed to the JVM as `-Dconfig.file` — how an estate
# states its own row policies without a rebuild. HOCON lists REPLACE rather than merge, so a
# `validate.policies` here replaces the built-in default set (`policies/policies.conf`) entirely.
#
# Example — a distribution-centre analyst role sees DC 5's rows only, everyone else sees all
# (one entry per table, because each table names the warehouse in its own column; the shared id
# is what the receipt reports, and each entry carries its table):
#
#   configFragment:
#     content: |
#       validate.policies = [
#         { id = "dc-scope", roles = ["kantheon-scope-dc-5"],
#           match { type = "exact", qname = "db.dbo.inventory" },
#           predicate { type = "in", column = "inv_warehouse_sk", values = [ { kind = "literal", value = 5, literal-type = "int" } ] } }
#         { id = "dc-scope", roles = ["kantheon-scope-dc-5"],
#           match { type = "exact", qname = "db.dbo.warehouse" },
#           predicate { type = "in", column = "w_warehouse_sk", values = [ { kind = "literal", value = 5, literal-type = "int" } ] } }
#         { id = "dc-scope", roles = ["kantheon-scope-dc-5"],
#           match { type = "exact", qname = "db.dbo.catalog_sales" },
#           predicate { type = "in", column = "cs_warehouse_sk", values = [ { kind = "literal", value = 5, literal-type = "int" } ] } }
#         { id = "dc-scope", roles = ["kantheon-scope-dc-5"],
#           match { type = "exact", qname = "db.dbo.web_sales" },
#           predicate { type = "in", column = "ws_warehouse_sk", values = [ { kind = "literal", value = 5, literal-type = "int" } ] } }
#         { id = "dc-scope", roles = ["kantheon-scope-dc-5"],
#           match { type = "exact", qname = "db.dbo.channel_sales" },
#           predicate { type = "in", column = "warehouse_sk", values = [ { kind = "literal", value = 5, literal-type = "int" } ] } }
#       ]
#
# Every table named must carry the column, or every query over it fails. `roles` / `exempt-roles`
# and the fail-closed rule are documented in `policies/policies.conf`.
#
# OFF unless `content` is set — with it empty the render is byte-identical to before. The chart
# writes `include classpath("application.conf")` at the top of the mounted file itself, because
# `-Dconfig.file` REPLACES the classpath config rather than merging with it, and a fragment that
# forgot the include would boot validate with no defaults at all. The pod template carries a hash
# of the rendered ConfigMap, so an edit restarts the pod (validate reads policies once, at boot).
configFragment:
  content: ""
  mountPath: /etc/tatrman/conf.d
  key: overlay.conf
