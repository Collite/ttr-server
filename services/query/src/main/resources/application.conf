ktor {
    deployment {
        port = 7305
        port = ${?QUERY_SERVER_PORT}
    }
    application {
        modules = [ org.tatrman.query.ApplicationKt.module ]
    }
}

grpc {
    port = 7306
    port = ${?QUERY_SERVER_GRPC_PORT}
    max-message-size-bytes = 33554432  // 32 MiB per Round 4 wire-format Rule 5
    reflection-enabled = false
    reflection-enabled = ${?GRPC_REFLECTION_ENABLED}
}

# Translate — the translator (lang ↔ RelNode ↔ SQL), gRPC 7276.
translate {
    host = "translate"
    host = ${?TRANSLATE_SERVER}
    port = 7276
    port = ${?TRANSLATE_SERVER_GRPC_PORT}
    # The FIRST parse after a (re)start pays Calcite planner cold-start
    # (~30-40s; warm parses are ~2s), which blew the old 30s deadline → CANCELLED
    # + retry. 120s gives the cold parse room to finish in one shot.
    deadline-seconds = 120
    deadline-seconds = ${?TRANSLATE_DEADLINE_SECONDS}
}

# Validate — the validator (RLS + TopN + column rules), gRPC 7286.
validate {
    host = "validate"
    host = ${?VALIDATE_SERVER}
    port = 7286
    port = ${?VALIDATE_SERVER_GRPC_PORT}
    deadline-seconds = 120
    deadline-seconds = ${?VALIDATE_DEADLINE_SECONDS}
}

# Dispatch — the worker dispatcher, gRPC 7291.
dispatch {
    host = "dispatch"
    host = ${?DISPATCH_SERVER}
    port = 7291
    port = ${?DISPATCH_SERVER_GRPC_PORT}
}

# Veles — the metadata service, gRPC 7261. Read only by RunSavedQuery (LQ, L-31): a saved query's stored plan.
veles {
    host = "veles"
    host = ${?VELES_GRPC_HOST}
    port = 7261
    port = ${?VELES_GRPC_PORT}
    deadline-seconds = 10
    deadline-seconds = ${?VELES_DEADLINE_SECONDS}
}

cache {
    max-entries = 1000
    max-entries = ${?QUERY_CACHE_MAX}
    expire-after-write-minutes = 60
    expire-after-write-minutes = ${?QUERY_CACHE_TTL_MIN}
}

retry {
    max-attempts = 3
    max-attempts = ${?QUERY_RETRY_MAX}
    initial-backoff-millis = 100
    initial-backoff-millis = ${?QUERY_RETRY_BACKOFF_MS}
    multiplier = 3.0
    jitter-percent = 50
}

# BI (contracts C-1) — the Arrow Flight SQL edge: JDBC (DBeaver, IntelliJ), ADBC (pandas) and the
# `tatrman://` Superset dialect. Opt-in; binds loopback unless a deployment behind the gateway says 0.0.0.0.
flight {
    enabled = false
    enabled = ${?QUERY_FLIGHT_ENABLED}
    port = 7308
    port = ${?QUERY_FLIGHT_PORT}
    bind = "127.0.0.1"
    bind = ${?QUERY_FLIGHT_BIND}
    # host:port of this pod's own gRPC door; empty = 127.0.0.1:<grpc.port>.
    loopback = ""
    loopback = ${?QUERY_FLIGHT_LOOPBACK}
    # A started statement nobody fetched is cancelled after this long.
    pending-ttl-seconds = 60
    pending-ttl-seconds = ${?QUERY_FLIGHT_PENDING_TTL_SECONDS}
    # How long a catalog snapshot is trusted before Veles is asked for its model version again.
    catalog-ttl-seconds = 30
    catalog-ttl-seconds = ${?QUERY_FLIGHT_CATALOG_TTL_SECONDS}
}

query {
    # Skip live gRPC client wiring on boot — used by tests and local smoke
    # contexts that construct the service directly.
    use-fixture = false
    use-fixture = ${?QUERY_USE_FIXTURE}
}

telemetry {
    enabled = false
    enabled = ${?OTEL_ENABLED_QUERY}
}
