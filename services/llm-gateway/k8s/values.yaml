# Default values for llm-gateway (LLM gateway, Spring Boot). Env-agnostic: sane defaults, NO cluster
# knowledge. Deploying environments override image, telemetry, the Postgres target, the LLM keys
# (secretEnv) and — for a test context — the LLM upstream base URL (via extraEnv → WireMock).

replicaCount: 1

image:
  repository: ghcr.io/collite/llm-gateway
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# HTTP port (REST + actuator) and gRPC port.
ports:
  http: 7280
  grpc: 9090

service:
  type: ClusterIP

resources:
  requests:
    memory: 768Mi
    cpu: 250m
  limits:
    memory: 1536Mi
    cpu: "1"

# Postgres target (the default Spring profile). Env-agnostic bare service name.
db:
  host: postgres
  port: 5432

# OpenTelemetry. OTEL_SERVICE_NAME always; the OTLP endpoint renders only when enabled.
# `enabled` → OTEL_ENABLED_LLM_GATEWAY; the exporter is `otlpHost` + `otlpGrpcPort` (gRPC, the lib default).
# `endpoint` is unread by shared otel-config — kept only for old values files. e.g.
#   telemetry: { enabled: true, otlpHost: mon-alloy.monitoring.svc.cluster.local, otlpGrpcPort: 4317 }
telemetry:
  enabled: false
  otlpHost: ""
  otlpGrpcPort: 4317
  endpoint: ""
  serviceName: llm-gateway

# Secret-backed env (valueFrom.secretKeyRef). Upstream LLM-provider keys; `optional: true` so the
# pod boots without them (a test context stubs the upstream at WireMock and needs no real key).
secretEnv:
  - { name: AZURE_OPENAI_API_KEY, secretName: llm-gateway-secrets, secretKey: azure-openai-api-key, optional: true }
  - { name: ANTHROPIC_API_KEY, secretName: llm-gateway-secrets, secretKey: anthropic-api-key, optional: true }

# Any other env (a deploying env adds to / replaces this list). A test context sets the LLM upstream
# base URL here to retarget it at WireMock (e.g. AZURE_OPENAI_ENDPOINT / ANTHROPIC_BASE_URL).
extraEnv: []

# Probes — Spring Boot actuator health groups. LLM gateway (Spring Boot + Spring AI + gRPC
# autoconfig) is a SLOW starter — ~97s on a CPU-throttled node — so it needs a startupProbe.
# While a startupProbe is running, kubelet suspends the liveness + readiness probes, so the
# 45s liveness budget can't kill the pod mid-boot (the bp-dsk CrashLoop, 2026-07-08). Budget:
# 10s + 40×10s = 410s before startup is declared failed.
# Target the readiness GROUP (state-only: readinessState), NOT the full `/actuator/health` — the
# aggregate goes 503 when the OPTIONAL Redis cache (llm.cache.enabled=false) isn't deployed, which
# would make the startupProbe never pass and the pod never become Ready (bp-dsk, 2026-07-08).
startupProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 40
readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 30
livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 45
  periodSeconds: 15

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Caller-key seed (off by default; a cluster turns it on in its own values). Registers each caller team's `ttrk-` key
# with this gateway: the plaintext keys come from the cluster's vault through an ExternalSecret (they never sit in
# git), and an ArgoCD PostSync Job writes sha256(key) into `virtual_keys` on every sync, which is the lookup the
# data plane's PgKeyValidator makes. Rows are matched by the hash itself, so a row inserted by hand before (the
# runbook's direct SQL) is taken over, not duplicated. With `revokeStale`, a team's other seeded keys are revoked
# once its current one is in, so a key rotated in the vault stops working at the next sync; keys minted through
# the admin API (`seeded = false`) are never touched. Needs External Secrets Operator.
keySeed:
  enabled: false
  image: ghcr.io/cloudnative-pg/postgresql:18-standard-bookworm
  secretStore:
    name: ""
    kind: ClusterSecretStore
  refreshInterval: 1h
  # One entry per caller team: the governance team id and the vault secret that holds its key, e.g.
  #   - { team: golem, vaultKey: ttrk-golem }
  teams: []
  revokeStale: true
  # The gateway's own database (the Postgres target its LLM_GATEWAY_DB_* env names), written as its owner role.
  db:
    host: postgres-rw.data.svc.cluster.local
    port: 5432
    name: llm_gateway
    user: llm_gateway
    passwordSecret: pg-llm-gateway-cred
    passwordKey: password
