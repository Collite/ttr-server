# LLM Gateway 2.0 model catalog (contracts §2.1). Migrated from 1.x models.yaml + rules.conf 2026-07-14
# (LG-P1·S1·T3). Tier aliases (haiku/sonnet/claude-haiku) and rules.conf aliases (gpt-4/fast) are folded
# into `aliases:` on the concrete models — NOT duplicate rows (1.x faked tier-1 with dup rows; C-1 tier 1).
#
# ⚠ INTERIM PRICING: 1.x carried a single legacy `cost` per model; 2.0 requires split input/output
# per-1M-token prices. Until Bora supplies the real numbers, input = output = the 1.x cost (flagged
# per row). Embeddings are input-only. Replace before cutover (pre-cutover checklist).
models:
  - id: azure-gpt-4o
    name: gpt-4o
    aliases: ["gpt-4"]            # rules.conf: "gpt-4" -> gpt-4o
    provider: azure
    upstream: gpt-4o
    type: chat
    tags: ["complex", "coding"]   # "smart" moved to gpt-6.1-sol (2026-10-24); no gpt-4o deployment on the tatrman resource
    pricing: { input: 10.0, output: 10.0 }   # interim (1.x cost=10)
    cacheTtlSeconds: 3600
    fallback: []                 # chains populated in LG-P3

  - id: azure-gpt-4o-mini
    name: gpt-4o-mini
    # (was alias "fast" — the generic "fast" tier now routes to azure-gpt-41; still reachable by name)
    provider: azure
    upstream: gpt-4o-mini
    type: chat
    tags: ["fast", "cheap", "chat"]
    pricing: { input: 1.0, output: 1.0 }     # interim (1.x cost=1)
    cacheTtlSeconds: 3600
    fallback: []

  # ⚠ The tatrman Azure resource (every cluster's AZURE_OPENAI_ENDPOINT) has NO text-embedding-ada-002 deployment:
  # this row answers 400 "The API deployment for this resource does not exist" there (2026-10-24). Use
  # text-embedding-3-small below — same 1536 dimensions, but a different vector space: re-embed, never mix.
  - id: azure-ada-002
    name: ada-002
    provider: azure
    upstream: text-embedding-ada-002
    type: embedding
    tags: ["embedding"]
    pricing: { input: 1.0 }                   # interim (1.x cost=1); embeddings are input-only
    cacheTtlSeconds: 0
    fallback: []

  - id: azure-text-embedding-3-small
    name: text-embedding-3-small
    provider: azure
    upstream: "${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}"   # the tatrman deployment's name
    type: embedding
    tags: ["embedding"]
    pricing: { input: 1.0 }                   # interim, as ada-002; embeddings are input-only
    cacheTtlSeconds: 0
    fallback: []

  - id: azure-gpt-41
    name: gpt-4.1
    # Generic tier keys (LlmGatewayPromptExecutor emits these) — Golem's mini/fast asks land on this one Azure
    # model; `deep` is the smart row's (azure-gpt-61-sol).
    aliases: ["mini", "fast"]
    provider: azure
    upstream: "${AZURE_OPENAI_CHAT_DEPLOYMENT:-tatrman-gpt-4.1}"   # per-deployment (olymp env); baked default off-Azure
    reasoning: ${AZURE_OPENAI_REASONING:-false}   # true when the deployment is a reasoning model (gpt-5/o-series):
    # the OpenAI-wire handler then strips temperature + top_p and maps max_tokens -> max_completion_tokens. Set
    # alongside AZURE_OPENAI_CHAT_DEPLOYMENT in olymp so it tracks the deployment per cluster.
    type: chat
    tags: ["tatrman"]
    pricing: { input: 10.0, output: 10.0 }   # interim (1.x cost=10)
    cacheTtlSeconds: 3600
    fallback: []

  - id: azure-gpt-61-sol
    name: gpt-6.1-sol
    # The "smart" tier (Bora, 2026-10-24): `model: "smart"` or `model_tags: ["smart"]` lands here, nowhere else.
    # And the generic `deep` tier (Bora, 2026-10-24): Golem composes the query on `deep` (its ladder's `capable`
    # rungs ask it too), while mini/fast stay on the chat deployment above.
    aliases: ["smart", "deep"]
    provider: azure
    upstream: "${AZURE_OPENAI_SMART_DEPLOYMENT:-gpt-6.1-sol}"   # the tatrman deployment's name
    # A reasoning model: Azure answers `max_tokens` with 400 "Use 'max_completion_tokens' instead" (probed
    # 2026-10-24), so the OpenAI-wire handler must strip temperature/top_p and map max_tokens.
    reasoning: ${AZURE_OPENAI_SMART_REASONING:-true}
    type: chat
    tags: ["smart", "complex"]
    pricing: { input: 10.0, output: 10.0 }   # interim, as gpt-4.1 — real price pending
    cacheTtlSeconds: 3600
    fallback: []

  - id: anthropic-opus-4-7
    name: claude-opus-4-7
    provider: anthropic
    upstream: claude-opus-4-7
    type: chat
    tags: ["complex", "coding", "frontier"]   # "smart" moved to gpt-6.1-sol (2026-10-24)
    pricing: { input: 15.0, output: 15.0 }   # interim (1.x cost=15)
    cacheTtlSeconds: 3600
    fallback: []

  - id: anthropic-sonnet-4-6
    name: claude-sonnet-4-6
    aliases: ["sonnet"]         # tier alias (Themis FAST)
    provider: anthropic
    upstream: claude-sonnet-4-6
    type: chat
    tags: ["balanced", "default"]
    pricing: { input: 3.0, output: 3.0 }     # interim (1.x cost=3)
    cacheTtlSeconds: 3600
    fallback: []

  - id: anthropic-haiku-4-5
    name: claude-haiku-4-5
    aliases: ["haiku", "claude-haiku"]   # tier aliases (Themis CHEAP; Golem GolemModels.Cheap)
    provider: anthropic
    upstream: claude-haiku-4-5
    type: chat
    tags: ["fast", "cheap"]
    pricing: { input: 1.0, output: 1.0 }     # interim (1.x cost=1)
    cacheTtlSeconds: 3600
    fallback: []
