# LLM Gateway 2.0 model catalog (contracts §2.1). Migrated from 1.x models.yaml + rules.conf 2026-07-14
# (LG-P1·S1·T3). Tier aliases (haiku/sonnet/claude-haiku) and rules.conf aliases (gpt-4/fast) are folded
# into `aliases:` on the concrete models — NOT duplicate rows (1.x faked tier-1 with dup rows; C-1 tier 1).
#
# Pricing is USD per 1M tokens; embeddings are input-only. DX-D22 (Bora, 2026-11-16) supplies the
# Azure list prices for the bp-dsk deployments (Sol, Terra, gpt-5-mini and text-embedding-3-small).
# Other rows retain the interim 1.x single `cost` as input/output, flagged per row.
# Cached-input/cache-write prices are comments: the current pricing shape has no fields for them.
models:
  - id: azure-gpt-4o
    name: gpt-4o
    aliases: ["gpt-4"]            # rules.conf: "gpt-4" -> gpt-4o
    provider: azure
    upstream: gpt-4o
    type: chat
    tags: ["complex", "coding"]   # "smart" moved to gpt-6.1-sol (2026-10-24); no gpt-4o deployment on the tatrman resource
    pricing: { input: 10.0, output: 10.0 }   # interim (1.x cost=10); not deployed on bp-dsk (2026-11-16)
    cacheTtlSeconds: 3600
    fallback: []                 # chains populated in LG-P3

  - id: azure-gpt-4o-mini
    name: gpt-4o-mini
    # (was alias "fast" — the generic "fast" tier now routes to azure-gpt-41; still reachable by name)
    provider: azure
    upstream: gpt-4o-mini
    type: chat
    tags: ["fast", "cheap", "chat"]
    pricing: { input: 1.0, output: 1.0 }     # interim (1.x cost=1); not deployed on bp-dsk (2026-11-16)
    cacheTtlSeconds: 3600
    fallback: []

  # ⚠ The tatrman Azure resource (every cluster's AZURE_OPENAI_ENDPOINT) has NO text-embedding-ada-002 deployment:
  # this row answers 400 "The API deployment for this resource does not exist" there (2026-10-24). Use
  # text-embedding-3-small below — same 1536 dimensions, but a different vector space: re-embed, never mix.
  # Reachable by its name only: no tag, so `model_tags=[embedding]` can't land here on the name tie-break.
  - id: azure-ada-002
    name: ada-002
    provider: azure
    upstream: text-embedding-ada-002
    type: embedding
    tags: []
    pricing: { input: 1.0 }                   # interim (1.x cost=1); embeddings are input-only; not deployed on bp-dsk (2026-11-16)
    cacheTtlSeconds: 0
    fallback: []

  # The embeddings tier: callers ask for `embedding`, never a model name, so the model can change here alone. They
  # must key stored vectors by the `model` the reply names, not by `embedding`: two models' vectors don't mix.
  - id: azure-text-embedding-3-small
    name: text-embedding-3-small
    aliases: ["embedding"]
    provider: azure
    upstream: "${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}"   # the tatrman deployment's name
    type: embedding
    tags: ["embedding"]
    pricing: { input: 0.022 }                 # DX-D22; embeddings are input-only
    cacheTtlSeconds: 0
    fallback: []

  - id: azure-gpt-41
    name: gpt-4.1
    # Generic tier keys (LlmGatewayPromptExecutor emits these) — Golem's mini/fast asks land on this one Azure
    # model; `deep` is the smart row's (azure-gpt-61-sol). DX-P4's extract-strong uses this Azure
    # OpenAI-wire route, which forwards strict response_format (Anthropic drops it).
    # bp-dsk overrides this row's upstream to gpt-5-mini; its existing caller-facing name stays gpt-4.1.
    aliases: ["mini", "fast", "extract-strong"]
    provider: azure
    upstream: "${AZURE_OPENAI_CHAT_DEPLOYMENT:-tatrman-gpt-4.1}"   # per-deployment (olymp env); baked default off-Azure
    reasoning: ${AZURE_OPENAI_REASONING:-false}   # true when the deployment is a reasoning model (gpt-5/o-series):
    # the OpenAI-wire handler then strips temperature + top_p and maps max_tokens -> max_completion_tokens. Set
    # alongside AZURE_OPENAI_CHAT_DEPLOYMENT in olymp so it tracks the deployment per cluster.
    type: chat
    tags: ["tatrman"]
    pricing: { input: 0.25, output: 2.0 }   # DX-D22 gpt-5-mini; cached input 0.03
    cacheTtlSeconds: 3600
    fallback: []

  - id: azure-gpt-61-sol
    name: gpt-6.1-sol
    # The "smart" tier (Bora, 2026-10-24): `model: "smart"` or `model_tags: ["smart"]` lands here, nowhere else.
    # And the generic `deep` tier (Bora, 2026-10-24): Golem composes the query on `deep` (its ladder's `capable`
    # rungs ask it too), while mini/fast stay on the chat deployment above.
    aliases: ["smart", "deep"]
    provider: azure
    upstream: "${AZURE_OPENAI_SMART_DEPLOYMENT:-gpt-6.1-sol}"   # the tatrman deployment's name
    # A reasoning model: Azure answers `max_tokens` with 400 "Use 'max_completion_tokens' instead" (probed
    # 2026-10-24), so the OpenAI-wire handler must strip temperature/top_p and map max_tokens.
    reasoning: ${AZURE_OPENAI_SMART_REASONING:-true}
    type: chat
    tags: ["smart", "complex"]
    pricing: { input: 4.0, output: 15.0 }    # DX-D22; cached input 0.20 · cache write 5.00
    cacheTtlSeconds: 3600
    fallback: []

  # Deployed but unused (DX-D22): roster only, with no tier alias or soft-match tag.
  - id: azure-gpt-61-terra
    name: gpt-6.1-terra
    aliases: []
    provider: azure
    upstream: "${AZURE_OPENAI_TERRA_DEPLOYMENT:-gpt-6.1-terra}"
    reasoning: ${AZURE_OPENAI_TERRA_REASONING:-true}
    type: chat
    tags: []
    pricing: { input: 2.0, output: 7.5 }     # DX-D22; cached input 0.10 · cache write 2.50
    cacheTtlSeconds: 3600
    fallback: []

  - id: anthropic-opus-4-7
    name: claude-opus-4-7
    provider: anthropic
    upstream: claude-opus-4-7
    type: chat
    tags: ["complex", "coding", "frontier"]   # "smart" moved to gpt-6.1-sol (2026-10-24)
    pricing: { input: 15.0, output: 15.0 }   # interim (1.x cost=15); not deployed on bp-dsk (2026-11-16)
    cacheTtlSeconds: 3600
    fallback: []

  - id: anthropic-sonnet-4-6
    name: claude-sonnet-4-6
    aliases: ["sonnet"]         # tier alias (Themis FAST)
    provider: anthropic
    upstream: claude-sonnet-4-6
    type: chat
    tags: ["balanced", "default"]
    pricing: { input: 3.0, output: 3.0 }     # interim (1.x cost=3); not deployed on bp-dsk (2026-11-16)
    cacheTtlSeconds: 3600
    fallback: []

  - id: anthropic-haiku-4-5
    name: claude-haiku-4-5
    aliases: ["haiku", "claude-haiku"]   # tier aliases (Themis CHEAP; Golem GolemModels.Cheap)
    provider: anthropic
    upstream: claude-haiku-4-5
    type: chat
    tags: ["fast", "cheap"]
    pricing: { input: 1.0, output: 1.0 }     # interim (1.x cost=1); not deployed on bp-dsk (2026-11-16)
    cacheTtlSeconds: 3600
    fallback: []
