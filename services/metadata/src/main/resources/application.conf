ktor {
    deployment {
        port = 7260
        port = ${?METADATA_HTTP_PORT}
    }
    application {
        modules = [ org.tatrman.metadata.ApplicationKt.module ]
    }
}

grpc {
    port = 7261
    port = ${?METADATA_GRPC_PORT}
    max-message-size-bytes = 33554432
    reflection-enabled = false
    reflection-enabled = ${?GRPC_REFLECTION_ENABLED}
}

metadata {
    descriptor {
        id = "v1-metadata"
        name = "v1 metadata model"
        description = "v1 metadata service model bundle"
    }

    # DF-M06 / Phase 07 B3 — periodic source re-load on top of the on-demand Refresh RPC. Default
    # 300s so the git model source (below) is tracked without a pod restart: each tick does a
    # cheap git fetch+reset and the reconcile is skipped when the commit SHA is unchanged.
    # Set to 0 to disable (sources refreshed only via explicit Refresh RPC). A source that has
    # never loaded is retried sooner, backing off from 5s to 60s, whatever this says.
    refresh-scheduler {
        interval-seconds = 300
        interval-seconds = ${?METADATA_REFRESH_INTERVAL_SECONDS}
    }

    sources {
        // A model directory on the local filesystem (e.g. a mounted volume). Off by default; it
        // exists to be named as the git source's fallback for demos that must come up offline:
        // METADATA_GIT_FALLBACK=local-model with METADATA_TTR_ROOT=/path/to/model.
        local-model {
            type = "filesystem"
            kind = "ttr"
            id = "local-model"
            enabled = false
            priority = 100
            path = ${?METADATA_TTR_ROOT}
        }

        // The model source: a git repository, cloned at boot and re-fetched on each scheduled
        // refresh, so the served model tracks the repository without a restart.
        //
        // Default: the public Hartland demo model — Collite/ttr-demo, branch `master`, sub-path
        // `model`. It needs no token, so a fresh install has a model to explore. To serve your own
        // model set METADATA_GIT_REMOTE_URI, METADATA_GIT_BRANCH and METADATA_GIT_SUBDIR together
        // (the branch and sub-path defaults are the Hartland repository's); a private repository
        // also needs METADATA_GIT_TOKEN (username defaults to "x-access-token"). An empty
        // METADATA_GIT_REMOTE_URI configures no source at all: Metadata logs an error, serves no model
        // and /ready answers 503.
        //
        // ttr-server#180 — no fallback by default, and Metadata bundles no model. When the repository
        // can't be loaded, Metadata serves no model (the built-in stock roles only), /ready answers 503
        // until the source has loaded once, and /status shows the error. A fallback is opt-in:
        // METADATA_GIT_FALLBACK names another source block (e.g. `local-model` above) to serve
        // while the repository is unavailable; the two are never merged (see FallbackSource).
        github-model {
            type = "git"
            // Parser kind for the repository contents. Only "ttr" is supported.
            kind = "ttr"
            kind = ${?METADATA_GIT_KIND}
            id = "github-model"
            enabled = true
            priority = 100
            remote-uri = "https://github.com/Collite/ttr-demo.git"
            remote-uri = ${?METADATA_GIT_REMOTE_URI}
            branch = "master"
            branch = ${?METADATA_GIT_BRANCH}
            subdirectory = "model"
            subdirectory = ${?METADATA_GIT_SUBDIR}
            username = "x-access-token"
            username = ${?METADATA_GIT_USERNAME}
            password = ${?METADATA_GIT_TOKEN}
            local-checkout-dir = ${?METADATA_GIT_CHECKOUT_DIR}
            fallback = ""
            fallback = ${?METADATA_GIT_FALLBACK}
        }

        // A second git repository, served beside the first — for a model whose packages live in
        // two repositories (a public one and a private one, say). Off unless
        // METADATA_GIT2_REMOTE_URI is set: a git block with an empty remote-uri configures no
        // source. It is a source of its own: it loads, refreshes and reports on /status on its
        // own, and the reconciler merges it with the first by package, as it merges any two
        // sources. Metadata is ready only when BOTH have loaded once. The token is the first
        // source's unless METADATA_GIT2_TOKEN is set; the branch and sub-path default to the
        // first source's defaults, not to its overrides — set them with the URI.
        second-model {
            type = "git"
            kind = "ttr"
            id = "second-model"
            enabled = true
            priority = 100
            remote-uri = ""
            remote-uri = ${?METADATA_GIT2_REMOTE_URI}
            branch = "master"
            branch = ${?METADATA_GIT2_BRANCH}
            subdirectory = "model"
            subdirectory = ${?METADATA_GIT2_SUBDIR}
            username = "x-access-token"
            username = ${?METADATA_GIT2_USERNAME}
            password = ${?METADATA_GIT_TOKEN}
            password = ${?METADATA_GIT2_TOKEN}
            local-checkout-dir = ${?METADATA_GIT2_CHECKOUT_DIR}
        }

        // Built-in stock roles from classpath resources.
        builtin-stock {
            type = "resources"
            kind = "ttr"
            id = "builtin-stock"
            path = "builtin"
            priority = 1000
        }
    }

    // CN-P5 S5.3 — the cn candidate store (cn contracts §6): producers submit candidate concepts, terms and relations;
    // a steward rejects or promotes them; a promotion is a model-text pull request. Off unless BOTH the database and
    // the token issuer are set — the store records who did what, so it never runs unauthenticated. Off, every
    // /v1/cn/* and /v1/vocabularies route answers 503 CN_STORE_OFF and the model is served as before.
    cn {
        // Schema `metadata` of this database, migrated by the service on first use (Flyway, classpath:db/cn).
        db {
            host = ""
            host = ${?METADATA_CN_DB_HOST}
            port = "5432"
            port = ${?METADATA_CN_DB_PORT}
            database = "metadata"
            database = ${?METADATA_CN_DB_NAME}
            user = "metadata"
            user = ${?METADATA_CN_DB_USER}
            password = ""
            password = ${?METADATA_CN_DB_PASSWORD}
        }
        // Every call carries a bearer token, verified here (RS256 against the realm's JWKS): the caller is the token.
        auth {
            issuer = ""
            issuer = ${?METADATA_CN_AUTH_ISSUER}
            jwks-uri = ""
            jwks-uri = ${?METADATA_CN_AUTH_JWKS_URI}
            audience = ""
            audience = ${?METADATA_CN_AUTH_AUDIENCE}
        }
        // Realm roles: stewards reject and promote (and submit as manual:<themselves>); importers register vocabulary
        // versions.
        steward-role = "cn-steward"
        steward-role = ${?METADATA_CN_STEWARD_ROLE}
        importer-role = "cn-importer"
        importer-role = ${?METADATA_CN_IMPORTER_ROLE}
        // Who submits as which producer: `producer=principal[|principal…]`, comma-separated; a principal is a service
        // account's client id, or `user:<username>` for a person. E.g. `kleio=kleio,au:synthesizer=automation`. A
        // `<deployment>:evidence` / `<deployment>:span-catalogue` producer registers its deployment.
        producers = ""
        producers = ${?METADATA_CN_PRODUCERS}
        promotion {
            // The model source a promotion patches (a block under metadata.sources); its loads decide merges.
            source = "github-model"
            source = ${?METADATA_CN_PROMOTION_SOURCE}
            // Optional: each promotion's diff and pull-request text as <dir>/<candidate id>.diff / .md.
            inbox-dir = ""
            inbox-dir = ${?METADATA_CN_INBOX_DIR}
            // Optional: open a GitHub pull request. The token needs contents and pull-requests write on the
            // repository (owner/name; derived from the source's github.com remote when unset).
            github {
                token = ""
                token = ${?METADATA_CN_PR_TOKEN}
                repository = ""
                repository = ${?METADATA_CN_PR_REPOSITORY}
                api-url = "https://api.github.com"
                api-url = ${?METADATA_CN_PR_API_URL}
            }
        }
        // Optional: POST every candidate event here (the steward app's queue refresh).
        notify-url = ""
        notify-url = ${?METADATA_CN_NOTIFY_URL}
    }
}

telemetry {
    enabled = false
    enabled = ${?OTEL_ENABLED_METADATA}
    otlp {
        endpoint = "http://localhost:4317"
        endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    }
}
