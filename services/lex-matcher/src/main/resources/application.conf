ktor {
    deployment {
        port = 7265
        port = ${?FUZZY_HTTP_PORT}
        port = ${?FUZZY_MATCHER_SERVER_PORT}  # legacy ai-platform env, kept as a no-op override
    }
    application {
        modules = [ org.tatrman.fuzzy.ApplicationKt.module ]
    }
}

security {
    enabled = false
    enabled = ${?SECURITY_ENABLED}
    api-keys = ${?API_KEYS}
    # S-3: admin authority for operator endpoints (/refresh). Comma-separated
    # admin API keys; the `admin` role via X-Roles (H-2 OBO) also authorizes.
    admin-api-keys = ""
    admin-api-keys = ${?FUZZY_ADMIN_API_KEYS}
    keycloak {
        url = ${?KEYCLOAK_URL}
        realm = ${?KEYCLOAK_REALM}
    }
    service {
        name = "fuzzy"
        name = ${?SECURITY_SERVICE_NAME}
        keycloak-client-id = ${?FUZZY_KEYCLOAK_CLIENT_ID}
        keycloak-client-secret = ${?FUZZY_KEYCLOAK_CLIENT_SECRET}
    }
}

telemetry {
    enabled = false
    enabled = ${?OTEL_ENABLED_FUZZY}
    otlp {
        endpoint = "http://localhost:4317"
        endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    }
}

# Fuzzy v1 (kantheon — Phase 2.2 fork).
#
# Two loader sources (fuzzy.loader.source):
#   static   (default): the in-repo JSON catalog (fuzzy-catalog.json) — no DB,
#                       local/CI-friendly, the Czech-aware fixture set.
#   metadata          : the full ai-platform fuzzy-matcher behaviour, re-forked
#                       2026-06-14 — Fuzzy asks Veles for the fuzzy-tagged
#                       columns, composes `SELECT pk, col FROM table`, queries
#                       the warehouse (fuzzy.type + fuzzy.{postgres,mssql}), and
#                       populates the catalog. Set FUZZY_LOADER_SOURCE=metadata
#                       + FUZZY_DB_TYPE to enable.
# Czech NLP (Nlp) stays disabled until Stage 2.3.
fuzzy {
    grpc {
        port = 7266
        port = ${?FUZZY_GRPC_PORT}
        reflection-enabled = false
        reflection-enabled = ${?GRPC_REFLECTION_ENABLED}
    }

    refreshIntervalSeconds = 3600
    refreshIntervalSeconds = ${?FUZZY_REFRESH_INTERVAL_SECONDS}

    token-based {
        distance-threshold = 0.20
        order-bonus-multiplier = 1.05
        max-order-bonus = 1.5
        idf-enabled = true
        idf-enabled = ${?FUZZY_TOKEN_BASED_IDF_ENABLED}
        # FZ-P2 retrieval path: "index-first" (default; term-at-a-time over the interned vocabulary,
        # exact-rescored — identical scores, parity-or-better, ~7–40× faster) or "legacy" (score
        # every exact-token seed). Escape hatch: FUZZY_TOKEN_BASED_RETRIEVAL=legacy.
        #
        # ⚑ Since LP-P3 flipped `match.version` to v2 below, that escape hatch is no longer usable
        # on its own: v2 + legacy REFUSES TO START (contracts §4.1), where before the flip the
        # same variable quietly gave you v1 + legacy. Reaching for legacy retrieval now means
        # setting FUZZY_MATCH_VERSION=v1 in the same breath.
        retrieval = "index-first"
        retrieval = ${?FUZZY_TOKEN_BASED_RETRIEVAL}
    }

    # LP TATRMAN scorer: "v2" (the default since LP-P3; fuzzy.match:v2 — exact/typo/prefix token
    # kinds on the ES-AUTO edit ladder, candidate-coverage tie-break at eps = 0.01, order bonus on
    # matched positions, per-token provenance) or "v1" (byte-pinned, the pre-LP engine). v2
    # requires retrieval = "index-first"; v2 + "legacy" refuses to start.
    #
    # Flipped at LP-P3 T3, executing ruling LPA-2 — "the golden slice, not a date, flips it":
    #   contracts 4.7 (i)   hero verdict diff under v1 and v2: identical, option order included
    #             (ii)  goldens/lp-partial.jsonl, 42 pinned cases, green under v2
    #             (iii) interleaved bench on the 100k corpus: v2 p95 <= v1 p95 in all three classes
    #   plus, on a live estate's own vocabulary (LP-P3 T2): 6 targets recovered that v1 missed,
    #         2 lost, and 87 spurious auto-binds on function-word spans removed against 34 added.
    #
    # ROLLBACK is one environment variable and needs no image: FUZZY_MATCH_VERSION=v1. The library
    # default in FuzzyMatcher stays V1 on purpose — an embedder that never asks keeps the pinned
    # engine, and this line moves only what this SERVICE serves.
    match {
        version = "v2"
        version = ${?FUZZY_MATCH_VERSION}
    }

    # Loader: "static" (default; the in-repo JSON catalog) or "metadata" — the member
    # vocabularies Veles lists (ListMemberVocabularies: one per indexed ATTRIBUTE, keyed by the
    # attribute's ref, each with a read plan the translator rendered for this warehouse's dialect),
    # read from the warehouse below. Needs a Veles that serves ListMemberVocabularies (MV-T1): an
    # older one leaves the member layer on its previous load with RG-FUZ-004 in GetStatus.
    loader {
        source = "static"
        source = ${?FUZZY_LOADER_SOURCE}
    }

    metadata {
        host = "veles"
        host = ${?FUZZY_METADATA_HOST}
        port = 7261
        port = ${?FUZZY_METADATA_PORT}
        timeout-ms = 10000
        timeout-ms = ${?FUZZY_METADATA_TIMEOUT_MS}
        namespace = ""
        namespace = ${?FUZZY_METADATA_NAMESPACE}
    }

    # RV-P1.4 (RV-39) — the compiled lexicon archive (`kind: "lexicon"`, written by the RV-P1.2
    # build). Empty = no declared layer: member vocabulary only, which is the pre-RV service and a
    # supported deployment for an estate that has not authored a lexicon yet.
    lexicon {
        archive-path = ""
        archive-path = ${?FUZZY_LEXICON_ARCHIVE_PATH}

        # RV-P7.3 — the LEARNED overlay archive (`kind: "overlay"`), written by the estate's
        # Golem from `rv_overlay_entries` and read here on the same two-clock discipline as the
        # lexicon above. Blank = no overlay: `overlay_version` stays ABSENT from the RV-39 tuple,
        # which is the contract for every pre-P7 estate, and results are untouched.
        overlay-archive-path = ""
        overlay-archive-path = ${?FUZZY_OVERLAY_ARCHIVE_PATH}
        # RV-32 (T4) — how far a TOKENS hit must beat the next target to be auto-bindable. Below
        # this the candidate is still returned, still ranked, just flagged `auto_bindable=false`:
        # the floor decides what may bind unattended, never what is visible.
        uniqueness-margin-floor = 0.05
        uniqueness-margin-floor = ${?FUZZY_LEXICON_UNIQUENESS_MARGIN_FLOOR}
        # RV-44 ⚑M-5 — a global floor on the DECLARED (within-class) score. 0 = OFF, which is the
        # ruled default: the evidence classes, WEAK-never-binds and the margin above already do the
        # safety work. Set it only if an estate wants a blunt cut on top of them.
        min-in-class-score = 0.0
        min-in-class-score = ${?FUZZY_LEXICON_MIN_IN_CLASS_SCORE}
    }

    # Warehouse connection for the `metadata` loader (Veles → SELECT pk,col →
    # DB → catalog). Read only when `fuzzy.type` is set (i.e. the env var below is
    # present) AND `loader.source = "metadata"`; the default `static` source has
    # no `fuzzy.type` and opens no connection. `type` = postgres | mssql.
    type = ${?FUZZY_DB_TYPE}
    postgres {
        host = "localhost"
        host = ${?FUZZY_PG_HOST}
        port = "5432"
        port = ${?FUZZY_PG_PORT}
        database = "warehouse"
        database = ${?FUZZY_PG_DATABASE}
        user = ${?FUZZY_PG_USER}
        password = ${?FUZZY_PG_PASSWORD}
    }
    mssql {
        host = "localhost"
        host = ${?FUZZY_MSSQL_HOST}
        port = "1433"
        port = ${?FUZZY_MSSQL_PORT}
        database = "warehouse"
        database = ${?FUZZY_MSSQL_DATABASE}
        user = ${?FUZZY_MSSQL_USER}
        password = ${?FUZZY_MSSQL_PASSWORD}
    }

    # Czech lemmatisation via nlp's gRPC BatchLemmatize (RG-P2.S1.T4 — the
    # lemma axis ON by default in the open chart). `port` is the nlp GRPC port
    # (7271; gRPC is nlp's contract, REST 7270 is its dev mirror).
    # Degradable: NLP unreachable ⇒ folded-surface matching, never an outage.
    nlp {
        enabled = true
        enabled = ${?FUZZY_NLP_ENABLED}
        host = "nlp"
        host = ${?NLP_SERVICE_GRPC_HOST}
        port = 7271
        port = ${?NLP_SERVICE_GRPC_PORT}
        timeout-ms = 5000
        timeout-ms = ${?FUZZY_NLP_TIMEOUT_MS}
        lang = "cs"
        lang = ${?FUZZY_NLP_LANG}
    }
}
