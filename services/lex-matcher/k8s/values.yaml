# Default values for fuzzy. Env-agnostic: sane defaults, NO cluster knowledge. Deploying
# environments override image, telemetry, and any extra wiring.

replicaCount: 1

image:
  repository: ghcr.io/collite/lex-matcher
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# HTTP port (probes + REST) and gRPC port (constellation services call the matcher over gRPC).
ports:
  http: 7265
  grpc: 7266

service:
  type: ClusterIP

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: "1"

telemetry:
  enabled: false
  endpoint: ""
  serviceName: fuzzy

# Secret-backed env (valueFrom.secretKeyRef) — none by default.
secretEnv: []

# Any other env (a deploying env REPLACES this list).
# Compiled lexicon archive (RV-P3.3). OFF by default: an empty `configMapName` renders no volume,
# no volumeMount and no `FUZZY_LEXICON_ARCHIVE_PATH` — the same posture the service
# code takes, where an unset archive path is the pre-RV path, not an error. The ConfigMap is
# created by the DEPLOYING context (olymp, from the estate repo's `generated/lexicon.tar.zst` via
# a kustomize configMapGenerator), never templated here: its content is one estate's vocabulary,
# and it must move with the model ref the metadata service is serving, not with a chart release.
#
# ttr-server#209 — SEVERAL archives, one per source the estate's packages come from (e.g. a second
# git source Metadata serves through `METADATA_GIT2_*`). List the extra ConfigMaps in `configMapNames`;
# `configMapName` stays the first (and may be left as it is). Each extra one is mounted beside the
# first at `<mountPath>.d/<configMapName>/<key>`, and the env then carries BOTH the singular var
# (the FIRST archive — an image older than the list key boots on it) and the list var (every
# archive, comma-separated), which the service loads as ONE declared layer. A single archive renders
# exactly as before. The FIRST archive is the primary; a later one that is broken, absent or on
# another schema than the primary's is skipped by the service (or served from its last good copy)
# and costs only its own words. ⚠ Every named ConfigMap must still EXIST: a missing one holds the pod
# in ContainerCreating (the volume is not optional), which keeps the old pods serving and makes the
# deploy error visible instead of quietly serving fewer words.
lexicon:
  configMapName: ""
  configMapNames: []
  key: lexicon.tar.zst
  mountPath: /etc/tatrman/lexicon

extraEnv: []

readinessProbe:
  path: /ready
  initialDelaySeconds: 2
  periodSeconds: 3
  failureThreshold: 20
livenessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
