# nlp front configuration (RG-P1.S1)
#
# The front is ENGINE-FREE: every model-bearing engine is an HTTP-adapter client
# to its own backend image (`url`), launched with an EXPLICIT model id (`model`,
# S-1). Only `langid` (lingua) runs in-process. Each backend declares its
# pinning `tier`: SELF_HOSTED_PINNED (in-cluster, conformant) or REMOTE_UNPINNED
# (Lindat dev/eval — RG-NLP-002).
#
# NOTE (S1): the self-hosted MorphoDiTa + NameTag 3 backend IMAGES land in
# RG-P1.S2 and Stanza + spaCy in RG-P1.S3. The in-cluster URLs below are the
# target state; the Lindat dev endpoints (commented) are the selectable
# REMOTE_UNPINNED tier the S2.T4 repoint toggles between.

service:
  host: "0.0.0.0"
  port: 7270        # REST mirror (dev/health only)
  grpc_port: 7271   # gRPC — the service contract

engines:
  # ---- self-hosted backends (models baked, digest-pinned; RG-P1.S2/S3) ----
  morphodita:
    enabled: true
    url: "http://nlp-morphodita:8080/tag"
    model: "czech-morfflex2.0-pdtc1.0-220710"   # = czech-morfflex2.0+pdtc (Q-10)
    model_version: "czech-morfflex2.0-pdtc1.0-220710"
    tier: "SELF_HOSTED_PINNED"
    timeout_seconds: 30
    max_retries: 3
    # Dev/eval REMOTE_UNPINNED tier (S2.T4 env-toggle):
    #   url: "https://lindat.mff.cuni.cz/services/morphodita/api/tag"
    #   tier: "REMOTE_UNPINNED"
    #   rate_limit_per_minute: 5

  nametag3:
    enabled: true
    url: "http://nlp-nametag3:8001/recognize"
    model: "nametag3-czech-cnec2.0-240830"       # Q-10
    model_version: "nametag3-czech-cnec2.0-240830"
    tier: "SELF_HOSTED_PINNED"
    timeout_seconds: 60      # torch CPU; generous per Q-10 cold-start
    max_retries: 3
    # Dev/eval REMOTE_UNPINNED tier:
    #   url: "https://lindat.mff.cuni.cz/services/nametag/api/recognize"
    #   tier: "REMOTE_UNPINNED"
    #   rate_limit_per_minute: 5

  stanza:
    enabled: true
    url: "http://nlp-stanza:8090"
    model: "stanza-cs-en"
    model_version: "stanza-1.10.0"
    tier: "SELF_HOSTED_PINNED"
    timeout_seconds: 60

  spacy:
    enabled: true
    url: "http://nlp-spacy:8091"
    model: "en_core_web_md"
    model_version: "en_core_web_md-3.8.0"
    tier: "SELF_HOSTED_PINNED"
    timeout_seconds: 30

  langid:
    enabled: true
    model: "lingua"
    model_version: "lingua-2.0"

  # ---- LLM_EMULATED (RV-6, RV-P8) — OFF, and it stays off unless an estate
  #      deliberately turns it on ----------------------------------------------
  #
  # A language model standing in for an engine, through this repo's llm-gateway.
  # It exists for the estate that CANNOT host a real engine — the UFAL stack is
  # CC BY-NC-SA (NL-5) — not as a preference. Turning it on trades a pinned model
  # for a hosted one: the analysis stops being reproducible across providers, the
  # conformance suite excludes the ops it touches (RV-P8.3), and every route it
  # serves carries the REMOTE_UNPINNED tier's `RG-NLP-002` caution.
  #
  # Nothing routes to it here. Enabling the engine is one decision and routing an
  # op to it is another — an estate makes both, in `op_routing` or a lane
  # overlay, and a config that routes to it while it is disabled REFUSES TO LOAD
  # rather than serving from somewhere else (RV-P8.2).
  #
  # `api_key` is deliberately empty in the file: the `ttrk-` virtual key comes
  # from a secret via NLP_LLM_EMULATED_API_KEY, like every other credential.
  llm_emulated:
    # Env overrides (a deployment decision, like the lane): NLP_LLM_EMULATED_ENABLED
    # / _URL / _MODEL / _API_KEY.
    enabled: false
    url: "http://llm-gateway:8080"
    model: "claude-haiku-4-5"
    api_key: ""
    timeout_seconds: 15        # ⚑RV-3's emulated-rung budget
    max_retries: 2
    # The v1 emulation set. DEP_PARSE is not promised (a wrong parse is silent);
    # TOKENIZE/SENTENCE_SPLIT are the degrade floor's, done deterministically and
    # in-process, and emulating them would spend a model call to do them worse.
    ops: ["LEMMATIZE", "POS_TAG", "NER"]
    languages: ["cs", "en"]
    cache_max_entries: 1024

# ── Lane (NL-4, NLS-P3.2) ────────────────────────────────────────────────────
#
# `default` is the lane a deployment can run anywhere: Stanza and spaCy only,
# permissively licensed, no UFAL images. `option` adds MorphoDiTa + NameTag 3,
# whose licence is a per-deployment decision (NL-5, still open with bora-legal).
#
# So the lane is not a preference among engines that are all present — it decides
# which engines exist. An engine named ONLY inside a `lane_overrides` block is not
# registered in the default lane, which is what makes `NER.cs` genuinely unrouted
# there rather than merely unpreferred (routing has a last-resort "any engine that
# supports this op" scan, and it can only find what was registered).
lane: "default"

# Per-op-per-language routing: {op}.{lang} -> engine name (+ optional .fallback).
# THIS IS THE DEFAULT-LANE TABLE (contracts §7).
op_routing:
  # Czech (cs) — Stanza serves everything it has a head for. `NER.cs` is ABSENT
  # on purpose: Stanza's Czech bundle has no NER head and nothing else in this
  # lane does either, so a cs NER request degrades explicitly (NLS-NLP-011) and
  # every other phase still runs (NL-14). It also gets no GetStatus capability
  # row — that absence is half the degrade.
  TOKENIZE.cs: "stanza"
  SENTENCE_SPLIT.cs: "stanza"
  LEMMATIZE.cs: "stanza"
  POS_TAG.cs: "stanza"
  DEP_PARSE.cs: "stanza"

  # English (en)
  TOKENIZE.en: "stanza"
  LEMMATIZE.en: "stanza"
  POS_TAG.en: "stanza"
  DEP_PARSE.en: "stanza"
  NER.en: "stanza"
  NER.en.fallback: "spacy"

  DETECT_LANGUAGE: "langid"

# Applied over `op_routing` when `lane` names it. This is the UFAL stack — the
# routing this file carried before NLS-P3.2, moved here unchanged: MorphoDiTa for
# cs morphology, NameTag 3 for cs NER, Stanza still for the cs dependency parse
# (the resolver's span-proposal feed).
lane_overrides:
  option:
    TOKENIZE.cs: "morphodita"
    SENTENCE_SPLIT.cs: "morphodita"
    LEMMATIZE.cs: "morphodita"
    POS_TAG.cs: "morphodita"
    DEP_PARSE.cs: "stanza"
    NER.cs: "nametag3"

# ── Rule packs, gazetteer lists, pipelines (NL-15, contracts §7) ──────────────
#
# Sources are directories (globbed for `**/*.pack.yaml` and `**/*.list.yaml`) or
# `http(s)` URLs naming one file. FAIL-ALL-OR-NOTHING: one bad file anywhere and
# nothing loads — the service still serves Analyze, reports `ready=false`, and
# puts the diagnostics on `GetStatus.pack_state`.
#
# Pack CONTENT is never part of the suite (NL-17): each world mounts its own.
# These paths are the mount points; an unmounted directory is reported, not fatal.
packs:
  sources: ["/etc/nlp/packs"]
lists:
  sources: ["/etc/nlp/lists"]

# ── Czech morphology (LM, NLS-P9.1 — cz-lemma contracts §5–§6) ────────────────
#
# `sources` is the `morph/v*` snapshot, then any separable share-alike member
# files, then world overlays — the pack loader's fail-all posture (NL-15): one
# unreadable source loads nothing at all. A failed load is NOT fatal. The front
# comes up, reports `LM-MORPH-001` on `GetStatus.morph_state`, keeps serving
# `Analyze`/`BatchLemmatize` and every non-morph pipeline, and answers
# FAILED_PRECONDITION only for the pipelines that need the lexicon — because the
# usual cause is a volume that has not mounted yet, and it comes good on a
# `ReloadPacks` rather than on a crash loop.
#
# EMPTY HERE ON PURPOSE, exactly as `pipelines: {}` is. The artifact is a mounted
# volume whose path differs per cluster and whose world overlays belong to that
# world; a shipped default pointing at a file no deployment has would make every
# `morph: true` pipeline refuse to boot (`validate_morph`). The offline hero
# recipe (`eval/offline-config.yaml`) turns it on; a cluster sets
# NLP_MORPH_SOURCES / NLP_MORPH_WORLD / NLP_MORPH_QUEUE_SINK.
#
#   morph:
#     sources: ["/etc/nlp/morph/cs.morph.snap", "/etc/nlp/morph/dfp.morph.overlay"]
#     world: "dfp"
#     queue:
#       sink: "url:http://morph-studio:8000"   # or dir:/var/lib/nlp/morph-queue
#       spool_dir: "/var/lib/nlp/morph-queue"  # the never-lose-a-miss fallback
#     worlds:
#       dfp: { spans: false, retention_days: 90 }
#
# `spans: false` is the default for every world and it is the whole S-4 posture:
# a lemmatizer queue collecting the surrounding text by default would be
# collecting user data by default. The front DROPS the span at the sink when a
# world says no — not at the reader.
morph:
  sources: []
  world: ""
  queue:
    sink: "none"
  worlds: {}

# A pipeline runs engine ops, then gazetteer lists, then rule phases — in that
# order, because the gazetteer matches on `lemma` an engine produced and the rules
# match on `Lookup` the gazetteer produced. Every reference here is validated
# against the loaded packs at boot AND at every reload (NLS-PACK-004).
#
# Commented out rather than shipped: the ids belong to a world's packs, and a
# pipeline referring to packs that are not mounted would fail the boot load. The
# hero recipe in `docker-compose.offline.yml` (NLS-P4.T4) mounts the pack tree and
# turns this on. A cluster sets its world's pipelines with `NLP_PIPELINES` (a JSON
# object of name → pipeline, merged over this block by name; DX-P3 T8f), beside the
# `packs.configMapName` / `lists.configMapName` it mounts.
#
# `morph: true` (LM, NLS-P9.1) swaps the front two ops for the in-process Czech
# morphology: `MORPH_TOKENIZE` + `MORPH_ANNOTATE` replace TOKENIZE + LEMMATIZE,
# and every op morph does not cover (SENTENCE_SPLIT, NER, DEP_PARSE) still runs
# on the engine and is merged onto the same document. The lane matrix is
# untouched by it — `NER.cs` is still unrouted in the default lane, still says
# so with `NLS-NLP-011`, and the gazetteer still reaches the same QueryPattern.
#
# The flag is per pipeline and not global because only the Czech ones have a
# snapshot to run against; a pipeline serving a language the snapshot is not in
# takes the engine path unchanged, decided from the artifact's own header rather
# than from config.
pipelines: {}
#  query-patterns:
#    morph: true
#    ops: [NER]              # TOKENIZE + LEMMATIZE are the morph front's now
#    gazetteer: [dfp-entity-aliases]
#    rules:
#      - { pack: dfp-query-patterns, phase: lookup-cleanup }
#      - { pack: dfp-query-patterns, phase: query-match }

default_language: "cs"
log_level: "INFO"
