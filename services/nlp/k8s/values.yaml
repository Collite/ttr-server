# Default values for nlp (Python/FastAPI, HTTP-only). Env-agnostic: sane defaults, NO cluster
# knowledge. Deploying environments override image, telemetry, and any extra wiring.

replicaCount: 1

image:
  repository: ghcr.io/collite/nlp
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Front ports: gRPC is the service contract (RG-P1.S1); HTTP is the dev/health
# mirror (uvicorn).
ports:
  http: 7270
  grpc: 7271

service:
  type: ClusterIP

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: "1"

# OpenTelemetry — nlp uses a host + gRPC-port + protocol triple (not a single endpoint URL).
# Off by default: no OTEL_EXPORTER_OTLP_HOST is rendered, and the service then builds no
# exporters at all. `enabled: true` without `otlpHost` fails the render rather than
# shipping a switch that does nothing.
telemetry:
  enabled: false
  otlpHost: ""
  otlpGrpcPort: 4317
  protocol: grpc

# Secret-backed env (valueFrom.secretKeyRef) — none by default.
secretEnv: []

# Any other env (a deploying env REPLACES this list).
extraEnv: []

# Probes — FastAPI exposes /readyz + /healthz.
readinessProbe:
  path: /readyz
  initialDelaySeconds: 2
  periodSeconds: 3
  failureThreshold: 20
livenessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ── NLS-P3.2: lane, rule packs, gazetteer lists ─────────────────────────────
#
# `lane` selects the engine stack (NL-4). `default` is Stanza + spaCy only, which
# any deployment may run; `option` adds MorphoDiTa + NameTag 3, whose licence is a
# per-deployment decision (NL-5). In the default lane cs NER is unrouted and
# degrades explicitly (NLS-NLP-011) — the front still answers.
#
# Set this to `option` ONLY where the UFAL backends below are actually enabled: the
# lane is what routes to them, and pointing at backends that are not deployed
# swaps an explicit degrade for a connection error.
lane: default

# ── RV-P8: LLM_EMULATED — a model standing in for an engine ─────────────────
#
# OFF, and the off state is the ABSENCE of the env vars rather than a var set to
# "false": a chart that says nothing here leaves the image's own default
# standing, which is what makes "nothing routes to it by default" survive a
# values file nobody edited.
#
# Turning this on is not a routing decision. The engine has to exist AND an op
# has to be routed at it in `config.yaml`'s `op_routing` (or a lane overlay), and
# a table that routes an op at a DISABLED emulated engine makes the pod refuse to
# boot rather than answer that op from somewhere else — loud, and one line to fix.
#
# What an estate buys with it: cs NER (or lemmas) where the licence forbids the
# UFAL images. What it gives up: a pinned model. Every emulated route advertises
# the REMOTE_UNPINNED tier and its `RG-NLP-002` caution, and the conformance
# suite excludes the ops it touches (RV-P8.3).
#
# `apiKey` is deliberately absent: the `ttrk-` virtual key rides `secretEnv` as
# NLP_LLM_EMULATED_API_KEY, like every other credential.
llmEmulated:
  enabled: false
  gatewayUrl: ""        # e.g. http://llm-gateway:8080 — required when enabled
  model: ""             # blank keeps config.yaml's pinned default

# Rule packs and gazetteer lists come from configmaps, mounted read-only. OFF
# unless `configMapName` is set — a front with no packs serves Analyze normally
# and simply has no pipelines. Content is per-world and never part of the suite
# (NL-17), which is why there is no default configmap to point at.
#
# The mount paths must match `config.yaml`'s `packs.sources` / `lists.sources`.
# A path with nothing mounted at it is reported through `GetStatus.pack_state`,
# not fatal — but it is also not a pipeline, so check both when RunPipeline says
# a pipeline is unknown.
packs:
  configMapName: ""
  mountPath: /etc/nlp/packs
lists:
  configMapName: ""
  mountPath: /etc/nlp/lists

# ── RG-P1.S2/S3 self-hosted engine backends ────────────────────────────────
# Separate workloads (own images, models baked, independent scaling). The front
# is engine-free and reaches these over the uniform / native HTTP protocols;
# the front's httpx client is OTel-instrumented, so front→backend calls are
# traced without the backends self-instrumenting. Resource requests are the
# Q-10 §5 sizing (arm64 dev numbers — re-baseline on the x86 cluster).
backends:
  # MorphoDiTa (S2) — cs tokenize/lemma/POS. C++, featherweight, scales with
  # concurrency. --max_request_size raised for BatchLemmatize.
  morphodita:
    enabled: true
    image:
      repository: ghcr.io/collite/nlp-morphodita
      tag: ""
      pullPolicy: IfNotPresent
    port: 8080
    replicaCount: 1
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { memory: 512Mi }
  # NameTag 3 (S2) — cs/en NER. torch CPU, thread-bound (~12 rps/replica) →
  # scale by replicas; generous readiness for the ~5 s cold start.
  nametag3:
    enabled: true
    image:
      repository: ghcr.io/collite/nlp-nametag3
      tag: ""
      pullPolicy: IfNotPresent
    port: 8001
    replicaCount: 2
    resources:
      requests: { cpu: "1", memory: 1536Mi }
      limits: { memory: 2Gi }
  # Stanza (S3) — cs DEP_PARSE (resolver span-proposal hot path) + en
  # tokenize/lemma/POS/dep/NER. torch CPU; generous readiness for cold start.
  stanza:
    enabled: true
    image:
      repository: ghcr.io/collite/nlp-stanza
      tag: ""
      pullPolicy: IfNotPresent
    port: 8090
    replicaCount: 1
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 2Gi }
  # spaCy (S3) — en tokenize + NER fallback. Lightweight, no torch.
  spacy:
    enabled: true
    image:
      repository: ghcr.io/collite/nlp-spacy
      tag: ""
      pullPolicy: IfNotPresent
    port: 8091
    replicaCount: 1
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { memory: 768Mi }
