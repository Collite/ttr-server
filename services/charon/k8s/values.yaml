# Default values for charon. Env-agnostic: sane defaults, NO cluster knowledge. Deploying
# environments (Olymp cluster values, or test-context values) override image, telemetry,
# the downstream wiring in extraEnv, the connections ConfigMap and the DB-credentials secret.

replicaCount: 1

image:
  # The published coordinate (CH-P2·T5a / review-074·F9b). CH-D7 ratified the image *name* `charon`;
  # this is the *registry-qualified* coordinate every sibling subchart carries (ghcr.io/collite/query,
  # metadata, …). A bare `charon` would render `docker.io/library/charon` — the Jib local name leaking into
  # the chart. Publishes to GHCR beside the siblings.
  repository: ghcr.io/collite/charon
  # Defaults to .Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# HTTP (data + control) port and gRPC port (constellation services call charon over gRPC).
# These are the container ports AND the service ports AND the probe target (http).
ports:
  http: 7250
  grpc: 7251

service:
  type: ClusterIP

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 1000m

# OpenTelemetry. charon reads a single OTLP endpoint URL (OTEL_EXPORTER_OTLP_ENDPOINT) plus
# the OTEL_ENABLED_CHARON flag. Point `endpoint` at a collector (e.g. the cluster's Alloy)
# and set enabled; leave disabled where no collector exists (e.g. test runs).
telemetry:
  enabled: false
  # e.g. http://alloy.observability.svc.cluster.local:4317
  endpoint: ""
  serviceName: charon

# Downstream / storage wiring. Defaults match the platform's stable in-cluster names
# (Seaweed S3 gateway + Redis) — env-agnostic. A deploying env REPLACES this list to retarget.
# CHARON_CONNECTIONS_PATH points at the mounted connection registry (see `connections` below).
extraEnv:
  - { name: CHARON_S3_ENDPOINT, value: "http://data-seaweedfs:8333" }
  - { name: CHARON_REDIS_URL, value: "redis://data-redis:6379" }
  - { name: CHARON_CONNECTIONS_PATH, value: "/etc/charon/connections.yaml" }

# DB credentials for the named connections ride in via an OPTIONAL secretRef (a blob-only pod
# still starts without it — plan §4 Stage 2.3). The secret is created by the deploying env.
envFrom:
  - secretRef:
      name: charon-db-credentials
      optional: true

# The named-connection registry, mounted read-only at `mountPath`. Set `configMapName` to a
# ConfigMap holding connections.yaml (with ${ENV} credential tokens fed from the envFrom
# secret). The ConfigMap itself is created by the deploying context (olymp), NOT templated
# here — its content is Bora-owned / environment-specific.
#
# CH-P2·T5a / review-074·F9b: default to EMPTY (blob-only boot). The ConfigMap is not templated
# here and the volume mounts non-optionally, so a default install with `configMapName` set would sit
# in FailedMount forever. Empty = no mount, so the out-of-box install boots blob-only and olymp opts
# in by setting the name — mirroring how the credentials secret above is already `optional: true`.
connections:
  configMapName: ""
  mountPath: /etc/charon

# Secret-resolver plugin (CH-D8 / CH-P3 T2b). OFF by default — an empty pluginDir.image ⇒ no
# initContainer, no plugin mount, and discover() sees no dir ⇒ the env-var default resolver
# (today's behaviour). A deploying env (olymp) sets `image` to a platform-published shadow of the
# transfer-secrets-adapter (Jib packaged image; its jars land in the emptyDir at mountPath) to bind
# the CH-D3 ConnectionSecretResolver port onto the platform secrets-spi. The estate runs the EXACT
# published open image; zero cz.tatrman bytes are baked in. See t2b-d3-mount-design.md.
pluginDir:
  # OCI image (platform-published, Jib) whose /app/*.jar the initContainer copies into the mount.
  image: ""
  pullPolicy: IfNotPresent
  # emptyDir mount → CHARON_PLUGIN_DIR (the dir the open loader globs for *.jar).
  mountPath: /opt/charon/plugins
  # Secret material for the mounted FileSecretStore (CHARON_SECRETS_MOUNT_ROOT). Only needed once
  # named connections resolve `secret://` refs; empty secretName ⇒ not mounted.
  secrets:
    secretName: ""
    mountPath: /etc/charon/secrets
  # Refs file (CHARON_CONN_REFS_FILE): NAME = secret://store/path, from a ConfigMap. Empty ⇒ off.
  refs:
    configMapName: ""
    mountPath: /etc/charon/conn-refs
    fileName: refs.conf
  # Fail the pod closed if no resolver provider registers (CHARON_REQUIRE_SECRET_RESOLVER). Set
  # true only AFTER the image is confirmed mounted (the ordering trap — see design §5).
  requireResolver: false

# Probes (HTTP on the http port).
readinessProbe:
  path: /ready
  initialDelaySeconds: 2
  periodSeconds: 3
  failureThreshold: 20
livenessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
