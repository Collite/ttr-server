ktor {
    deployment {
        port = 7131
        port = ${?AUTOMATION_SERVER_PORT}
    }
    application {
        modules = [ org.tatrman.automation.ApplicationKt.module ]
    }
}

# AU contracts §8. The keys the service cannot run without have NO default here — db.host, door.queryUrl,
# door.velesUrl, auth.jwksUrl, auth.issuer — so a pod missing one fails at start, naming all of them
# (AutomationConfig.load).
automation {
    # The ledger's Postgres: the `automation` database (D-118), schema `automation` + pgmq (D-130). The shape is
    # the shared DatabaseConnection's (type/host/port/database/user/password).
    db {
        type = "POSTGRES"
        host = ${?AUTOMATION_DB_HOST}
        port = "5432"
        port = ${?AUTOMATION_DB_PORT}
        database = "automation"
        database = ${?AUTOMATION_DB_NAME}
        user = "automation"
        user = ${?AUTOMATION_DB_USER}
        password = ""
        password = ${?AUTOMATION_DB_PASSWORD}
    }

    # The door (query), the model (veles) and the Python sidecar (worker-polars in automation-sidecar mode).
    door {
        queryUrl = ${?AUTOMATION_DOOR_QUERY_URL}
        velesUrl = ${?AUTOMATION_DOOR_VELES_URL}
        sidecarUrl = ${?AUTOMATION_DOOR_SIDECAR_URL}
    }

    # Bearer verification (§7; LR-14): RS256 against the realm's JWKS, `iss` must equal `issuer`, `aud` must
    # contain `audience` when one is set. `tokenUrl` is where the named identities' client credentials are
    # exchanged for their tokens — the realm's token endpoint, by default the JWKS URL's sibling. `authorMap`
    # maps a commit author (e-mail, else name) to the principal the deployment's `author` is (D-90), as
    # `author=principal` pairs separated by commas.
    auth {
        jwksUrl = ${?AUTOMATION_AUTH_JWKS_URL}
        issuer = ${?AUTOMATION_AUTH_ISSUER}
        audience = ${?AUTOMATION_AUTH_AUDIENCE}
        tokenUrl = ${?AUTOMATION_AUTH_TOKEN_URL}
        authorMap = ""
        authorMap = ${?AUTOMATION_AUTHOR_MAP}
    }

    # The world's model repo the bundles are read from (/refresh, S0.2) and the preview branches (D-111).
    bundle {
        git {
            url = ${?AUTOMATION_BUNDLE_GIT_URL}
            branch = "master"
            branch = ${?AUTOMATION_BUNDLE_GIT_BRANCH}
            path = ""
            path = ${?AUTOMATION_BUNDLE_GIT_PATH}
            token = ${?AUTOMATION_BUNDLE_GIT_TOKEN}
        }
        previews {
            allowedBranches = []
            idleEvictHours = 24
        }
    }

    staging {
        kind = "local"
        kind = ${?AUTOMATION_STAGING_KIND}
        path = "/tmp/automation-staging"
        path = ${?AUTOMATION_STAGING_PATH}
        url = ${?AUTOMATION_STAGING_URL}
    }

    scheduler {
        tz = "UTC"
        tz = ${?AUTOMATION_SCHEDULER_TZ}
        enabled = true
        enabled = ${?AUTOMATION_SCHEDULER_ENABLED}
    }

    # D-73: staging 24 h after close + 1 h grace; protocol records 400 days; the ledger is permanent.
    retention {
        stagingHours = 24
        graceHours = 1
        protocolDays = 400
    }

    budgets {
        syncDefault = 60s
        batchDefault = 30m
        displayRows = 200
        detailLimit = 200
    }

    # `true` holds the scheduler and answers new runs `503 paused` (S3.3).
    paused = false
    paused = ${?AUTOMATION_PAUSED}

    policies {
        fragment = ${?AUTOMATION_POLICIES_FRAGMENT}
    }

    # Named identities' and connectors' credentials; the TTR_CONN_<NAME> env is merged over this at load.
    connections {}
}

telemetry {
    enabled = false
    enabled = ${?OTEL_ENABLED_AUTOMATION}
}
