ktor {
    deployment {
        port = 7302
        port = ${?POSTGRES_SERVER_PORT}
    }
    application {
        modules = [ org.tatrman.worker.postgres.ApplicationKt.module ]
    }
}

grpc {
    port = 7303
    port = ${?POSTGRES_SERVER_GRPC_PORT}
    max-message-size-bytes = 33554432  // 32 MiB per Round 4 wire-format Rule 5
    reflection-enabled = false
    reflection-enabled = ${?GRPC_REFLECTION_ENABLED}
}

worker {
    engine = "postgres"
    engine-version = "PostgreSQL"
    engine-version = ${?POSTGRES_ENGINE_VERSION}
    # Tests and local smoke contexts skip both pool init and translator wiring.
    use-fixture = false
    use-fixture = ${?POSTGRES_USE_FIXTURE}
}

# Translate — the lang ↔ RelNode ↔ SQL translator (services/translate, gRPC 7276).
# Postgres calls Translate.UnparseFromRelNode to turn the validated RelNode plan into
# PostgreSQL it can execute.
translate {
    host = "translate"
    host = ${?TRANSLATE_SERVER}
    port = 7276
    port = ${?TRANSLATE_SERVER_GRPC_PORT}
    # Deadline for UnparseFromRelNode. Translate is usually warm by the time the worker
    # unparses (Query parsed first), but on a truly cold path the Calcite warmup can
    # still bite — 120s.
    timeout-seconds = 120
    timeout-seconds = ${?TRANSLATE_TIMEOUT_SECONDS}
}

# Per-connection JDBC pool config (the named-connection idiom; charon/architecture §6).
# Each `id` is what arrives in ExecuteRequest.connection_id; the pool is opened lazily on
# the first request that targets it. Credentials are NEVER in the request and NEVER
# hardcoded here — they arrive via env vars from K8s sealed secrets. An empty connections
# block boots Postgres with zero connections (Ready only in fixture mode); a real connection
# is activated by an overlay that sets the env vars below.
#
# pg-midas is the v1 operational connection: the Midas Postgres, read through the non-owner
# `midas_app_readonly` role so RLS policies apply. `requires-tenant-id = true` gates the RLS
# session contract (SET LOCAL app.tenant_id per query; enforced Stage 1.3). It stays commented
# until its env vars are present (it has no safe defaults — pure env).
#
# pg-tpcds is the TPC-DS warehouse connection (WS-T2, contracts §4.5): read through the SELECT-only
# `tpcds_readonly` role (mirrors midas_app_readonly). TPC-DS is NOT multi-tenant, so
# `requires-tenant-id = false` — Postgres skips the RLS envelope (no SET LOCAL app.tenant_id) for it.
# Defaults let local/CI boot cleanly; the deployed chart's extraEnv overrides host/user/password
# (password from the pg-tpcds-ro-cred ExternalSecret). Pools open lazily, so an unreachable
# warehouse never blocks boot.
connections {
    pg-tpcds {
        host = "test-pg.data.svc.cluster.local"
        host = ${?POSTGRES_PG_TPCDS_HOST}
        port = 5432
        database = "tpc-ds-1g"
        default-schema = "public"
        username = "tpcds_readonly"
        username = ${?POSTGRES_PG_TPCDS_USER}
        password = ""
        password = ${?POSTGRES_PG_TPCDS_PASSWORD}
        max-pool-size = 10
        read-only = true
        requires-tenant-id = false
        # built URL: jdbc:postgresql://<host>:<port>/<database>
    }

    # pg-hartland-{us,cz} — the two Hartland demo worlds (BM-2), one governed model over two
    # currency-scoped databases on the shared hartland-pg CNPG. Read through the SELECT-only
    # `hartland_{us,cz}_readonly` roles; not multi-tenant (`requires-tenant-id = false`). PURE ENV:
    # `host` has NO default, so ConnectionPoolManager.fromConfig SKIPS these where the deployment
    # didn't set POSTGRES_PG_HARTLAND_{US,CZ}_HOST (i.e. everywhere but hartland) — declaring them in
    # the base conf is inert off-hartland, no boot crash, no dead connection advertised.
    pg-hartland-us {
        host = ${?POSTGRES_PG_HARTLAND_US_HOST}
        port = 5432
        database = "hartland_us"
        default-schema = "public"
        username = "hartland_us_readonly"
        username = ${?POSTGRES_PG_HARTLAND_US_USER}
        password = ""
        password = ${?POSTGRES_PG_HARTLAND_US_PASSWORD}
        max-pool-size = 10
        read-only = true
        requires-tenant-id = false
    }
    pg-hartland-cz {
        host = ${?POSTGRES_PG_HARTLAND_CZ_HOST}
        port = 5432
        database = "hartland_cz"
        default-schema = "public"
        username = "hartland_cz_readonly"
        username = ${?POSTGRES_PG_HARTLAND_CZ_USER}
        password = ""
        password = ${?POSTGRES_PG_HARTLAND_CZ_PASSWORD}
        max-pool-size = 10
        read-only = true
        requires-tenant-id = false
    }

    # pg-entry — the investment book (IE-C26), read through the SELECT-only `entry_readonly` role.
    # A THIRD database on the same hartland CNPG, not a third world: the two above are one model
    # over two currency-scoped copies (BM-2, one delivered at a time), while this one holds a
    # different package's tables (`db.dbo.investment_*`, the model synced into hartland's
    # `model/investment/`) and is live alongside whichever world is delivered. Dispatch reaches it
    # by qname prefix through an overlay `world.table-connections` fragment, not by being the
    # default connection.
    #
    # ⛔ THE DECLARATION IS THE ACTIVATION, and the env vars alone are not. `ConnectionPoolManager`
    # iterates the connections DECLARED here; a deployment that sets POSTGRES_PG_ENTRY_* against an
    # image whose conf never named `pg-entry` gets three env vars nothing reads, a worker that
    # reports itself healthy, and `no_worker_for_connection` on the first investment query. Same
    # PURE ENV shape as the two above — `host` has no default, so this is inert everywhere the
    # deployment did not set POSTGRES_PG_ENTRY_HOST.
    #
    # `default-schema = "public"` is the PHYSICAL schema and is right; the model's `dbo` is a
    # catalog handle, resolved long before the JDBC connection sees anything (IE-S2.3·D1b).
    pg-entry {
        host = ${?POSTGRES_PG_ENTRY_HOST}
        port = 5432
        database = "entry"
        default-schema = "public"
        username = "entry_readonly"
        username = ${?POSTGRES_PG_ENTRY_USER}
        password = ""
        password = ${?POSTGRES_PG_ENTRY_PASSWORD}
        max-pool-size = 10
        read-only = true
        requires-tenant-id = false
    }

    # AU D2: the declaration is the activation. Each host is pure env with NO default:
    # absent env leaves the connection unadvertised; O1 supplies the credentials and routes.
    pg-hartland-cz-writer {
        host = ${?POSTGRES_PG_HARTLAND_CZ_WRITER_HOST}
        port = 5432
        database = "hartland_cz"
        default-schema = "public"
        username = "hartland_cz_writer"
        username = ${?POSTGRES_PG_HARTLAND_CZ_WRITER_USER}
        password = ""
        password = ${?POSTGRES_PG_HARTLAND_CZ_WRITER_PASSWORD}
        max-pool-size = 10
        read-only = false
        requires-tenant-id = false
    }
    pg-hartland-us-writer {
        host = ${?POSTGRES_PG_HARTLAND_US_WRITER_HOST}
        port = 5432
        database = "hartland_us"
        default-schema = "public"
        username = "hartland_us_writer"
        username = ${?POSTGRES_PG_HARTLAND_US_WRITER_USER}
        password = ""
        password = ${?POSTGRES_PG_HARTLAND_US_WRITER_PASSWORD}
        max-pool-size = 10
        read-only = false
        requires-tenant-id = false
    }
    pg-hartland-automation-cz {
        host = ${?POSTGRES_PG_HARTLAND_AUTOMATION_CZ_HOST}
        port = 5432
        database = "automation"
        default-schema = "cz"
        username = "hartland_automation_dml"
        username = ${?POSTGRES_PG_HARTLAND_AUTOMATION_CZ_USER}
        password = ""
        password = ${?POSTGRES_PG_HARTLAND_AUTOMATION_CZ_PASSWORD}
        max-pool-size = 10
        read-only = false
        requires-tenant-id = false
    }
    pg-hartland-automation-us {
        host = ${?POSTGRES_PG_HARTLAND_AUTOMATION_US_HOST}
        port = 5432
        database = "automation"
        default-schema = "us"
        username = "hartland_automation_dml"
        username = ${?POSTGRES_PG_HARTLAND_AUTOMATION_US_USER}
        password = ""
        password = ${?POSTGRES_PG_HARTLAND_AUTOMATION_US_PASSWORD}
        max-pool-size = 10
        read-only = false
        requires-tenant-id = false
    }

    # pg-midas {
    #   host = ${?POSTGRES_PG_MIDAS_HOST}
    #   port = 5432
    #   database = "midas"
    #   default-schema = "public"
    #   username = ${?POSTGRES_PG_MIDAS_USER}      # midas_app_readonly
    #   password = ${?POSTGRES_PG_MIDAS_PASSWORD}
    #   max-pool-size = 10
    #   read-only = true
    #   requires-tenant-id = true
    #   # built URL: jdbc:postgresql://<host>:<port>/<database>
    # }
}

execution {
    default-batch-size-rows = 10000
    max-batch-size-rows = 100000
    default-timeout-seconds = 300
    max-timeout-seconds = 600
    max-blob-bytes-per-cell = 8388608  // 8 MiB per Round 6.C decision
}

telemetry {
    enabled = false
    enabled = ${?OTEL_ENABLED_POSTGRES}
    otlp {
        endpoint = "http://localhost:4317"
        endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    }
}
