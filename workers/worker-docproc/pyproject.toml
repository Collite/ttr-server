[project]
name = "workers-docproc"
version = "0.11.0"
description = "docproc — the stateless document-processing worker runtime (Python)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "httpx>=0.28",
    "pyhocon>=0.3.61",
    "fastapi[standard]>=0.115",
    "uvicorn>=0.34",
    "prometheus-client>=0.21",
    "jsonschema>=4.23",
    "pyyaml>=6",
    "grpcio>=1.85",
    "protobuf>=7.35.1",
    "otel-config",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docproc"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "testcontainers[postgres]>=4.15",
    "respx>=0.22",
    "ruff>=0.9.4",
    "mypy>=1.13",
    "grpcio-tools>=1.85",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Component tier — mirrors the Kotlin `componentTest` source set: real Postgres via
# testcontainers-python. Select with `just test-py workers/worker-docproc -m component`.
markers = [
    "component: real-dependency component tier (testcontainers-python; no cluster)",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["src/docproc/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["src/docproc/_generated"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.uv.sources]
otel-config = { path = "../../shared/libs/python/otel-config", editable = true }

[[tool.mypy.overrides]]
module = ["pyhocon.*", "otel_config.*"]
ignore_missing_imports = true
follow_untyped_imports = false
