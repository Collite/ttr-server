[project]
name = "workers-docproc"
version = "0.11.0"
description = "docproc — the document-extraction worker runtime (Python). DX-P0 spike skeleton: the pgmq bus and the message models only; the runtime, the kinds and the image come later."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docproc"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "testcontainers[postgres]>=4.15",
    "respx>=0.22",
    "ruff>=0.9.4",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Component tier — mirrors the Kotlin `componentTest` source set: real Postgres via
# testcontainers-python. Select with `just test-py workers/worker-docproc -m component`.
markers = [
    "component: real-dependency component tier (testcontainers-python; no cluster)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true
