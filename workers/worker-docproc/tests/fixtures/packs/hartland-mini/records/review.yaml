# record-etl mapping (P3 S3.3 T6): the active Record.review annotations of a subject → the world DB's `review` table
# (records/ddl/review.sql), a subject-scoped delete + insert in one transaction. A Ref attribute resolves through
# its dimension table: the Ref's qname (the code the source names it) is matched, the key is stored.
entity: er.entity.review
table: review
key: review_id                 # generated by the table (identity); stable across re-runs by the record key
subject: [item, customer]
columns:
  item:             { from: attributes.item, ref: { table: item, match: item_id, value: sk } }
  customer:         { from: attributes.customer, ref: { table: customer, match: name, value: sk } }
  rating:           { from: attributes.rating }
  title:            { from: attributes.title }
  body:             { from: attributes.body }
  sentiment:        { from: attributes.sentiment }
  verification:     { from: modifiers.verification }
  temporal_context: { from: modifiers.temporal_context }
  price_paid:       { from: attributes.price_paid }
  helpful_votes:    { from: attributes.helpful_votes }
  recommended:      { from: attributes.recommended }
  reviewed_on:      { from: attributes.reviewed_on }
  recorded_at:      { from: attributes.recorded_at }
  # The provenance columns (er tag "provenance"): written from the run, never from the payload.
  annotation_refs:   { provenance: evidence }        # a JSON array of the record's evidence annotation ids
  consolidation_run: { provenance: consolidation_run }
