apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-docproc
  labels:
    app: worker-docproc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-docproc
  template:
    metadata:
      labels:
        app: worker-docproc
    spec:
      containers:
        - name: worker-docproc
          image: worker-docproc:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7310
          env:
            - name: DOCPROC_POOL
              value: cpu
            - name: PIPELINE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: docproc-pipeline-db
                  key: url
            - name: DOCWH_STORE_URL
              value: http://docwh-store:7261
            - name: DOCWH_PIPELINE_URL
              value: http://docwh-pipeline:7280
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: worker-docproc
spec:
  selector:
    app: worker-docproc
  ports:
    - name: http
      port: 7310
      targetPort: http
