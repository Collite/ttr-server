# Default values for health. Env-agnostic: sane defaults, NO cluster knowledge. Deploying
# environments (Olymp cluster values, or test-context values) override image and telemetry, and
# supply their own roster of checks as the config fragment (`configFragment`, below).

replicaCount: 1

image:
  repository: ghcr.io/collite/health
  # Defaults to .Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# health exposes a single HTTP port (the roll-up REST API). No gRPC, no MCP wrapper.
ports:
  http: 7000

service:
  type: ClusterIP

resources:
  requests:
    memory: 192Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: "1"

# OpenTelemetry. Reads a single OTLP endpoint URL (OTEL_EXPORTER_OTLP_ENDPOINT) plus the
# per-service OTEL_ENABLED_HEALTH flag. Point `endpoint` at a collector (e.g. the cluster's
# Alloy) and set enabled; leave disabled where no collector exists (e.g. test runs).
telemetry:
  enabled: false
  endpoint: ""
  serviceName: health-check-service

# Extra container env (e.g. HEALTH_PROMETHEUS_URL for prometheus-type checks).
extraEnv: []

# The per-cluster ROSTER (README "Per-cluster roster"). The bundled application.conf carries the
# reference estate's technologies; another estate supplies its own as a config fragment:
#
#   configFragment:
#     content: |
#       health-check-service.roster {
#         technologies { metadata { type = native, url = "http://metadata.ttr-server:7260", healthEndpoint = "/ready" } … }
#       }
#
# A `roster` block REPLACES the bundled technologies (a merge would keep every target the estate does
# not run, as a red tile). The library mounts the fragment, points the JVM at it and rolls the pod when
# it changes (tatrman-service `configFragment`).
configFragment:
  content: ""

# The content rows of External Secrets and cert-manager read the Kubernetes API. `serviceAccount.name`:
# the chart creates that account and the pod runs as it. `rbac.enabled` (needs the name): a ClusterRole
# that may get/list ExternalSecrets and Certificates (their status — never a Secret), bound to it.
rbac:
  enabled: false
serviceAccount:
  name: ""

# Probes hit /healthz — the cheap SELF-liveness route (200 immediately, independent of any target;
# HealthRoutes.kt). NOT /health/all: that fans out to every configured target (each up to a 30s
# timeout), so with any unreachable target it exceeds the kubelet probe timeout → the request is
# cancelled → the pod is killed even though the aggregator itself is fine. /health/all is the
# DASHBOARD roll-up; target-state belongs there, not on the pod probe.
readinessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 30
livenessProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 30

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
