ktor {
    deployment {
        port = 7000
        port = ${?HEALTH_CHECK_SERVICE_PORT}
    }
}

telemetry {
    enabled = false
    enabled = ${?OTEL_ENABLED_HEALTH}
    otlp {
        endpoint = "http://localhost:4317"
        endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    }
}

# FO-P5.S2 (FO-28): the open-tier status page reads the model fingerprint (model_version) from veles's
# /status. Retunable per estate via the env override (olymp ConfigMap).
status-page {
  model-fingerprint-url = "http://veles:7260/status"
  model-fingerprint-url = ${?VELES_STATUS_URL}
}

# Health checks for every technology shown on the landing's Platform status — the REFERENCE roster,
# which is the hartland estate's (the showcase cluster: every Kantheon agent, the whole ttr-server spine,
# the platform tiers). The landing's `services.json` names the same keys, grouped.
#
# Each entry is one of three checker types:
#   native     - HTTP GET <url><healthEndpoint>; healthy on 2xx.
#   tcp        - plain TCP connect to <host>:<port>; healthy if it connects
#                (used for services that don't speak HTTP, e.g. PostgreSQL).
#   prometheus - PromQL `up{job="<job>"}` against <prometheusUrl>; healthy if == 1.
#
# An entry may add a `status` block: where the service reports its CONTENT (what model it serves, what
# it loaded and when) and how to read it — dotted paths into the body, or a named adapter
# (content/Adapters.kt). `/health/all/detailed` carries it per technology, `/status/all` alone.
#
# ANOTHER ESTATE replaces the whole `technologies` block with its own: a `health-check-service.roster`
# block, which the chart supplies as its config fragment (`configFragment.content`; README "Per-cluster
# roster"). The services are addressed `<service>.<namespace>` so the roster holds wherever the health
# service itself runs.
health-check-service {
  prometheus {
    url = "http://mon-prometheus-server.monitoring"
    url = ${?HEALTH_PROMETHEUS_URL}
    timeout = 5000
    timeout = ${?HEALTH_PROMETHEUS_TIMEOUT}
    # Result cache TTL (seconds); checks within this window are served from cache.
    queryInterval = 30
    queryInterval = ${?HEALTH_CACHE_TTL_SECONDS}
  }

  technologies {

    # ──── agents ────────────────────────────────────────────────────────────────────────────────
    # One per Shem (the golems ApplicationSet). No /status yet: the row carries health only (LH S5.1).
    golem-hartland {
      type = native
      url = "http://golem-hartland.kantheon:7420"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    golem-hartland-finance {
      type = native
      url = "http://golem-hartland-finance.kantheon:7420"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    pythia {
      type = native
      url = "http://pythia.kantheon:7090"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    kleio {
      type = native
      url = "http://kleio.kantheon:7270"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    # Hartland's gateway-only Hebe ingress protects its trusted identity header.
    # Exact public /healthz returns plain OK; the console and /ready retain OIDC.
    hebe {
      type = native
      url = "https://hebe.hartland.collite.cz"
      healthEndpoint = "/healthz"
      timeout = 5000
    }

    automation {
      type = native
      url = "http://automation.ttr-server:7131"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    # ──── automation ────────────────────────────────────────────────────────────────────────────
    # Operated by olymp's middleware area (N8-P1); keep the fallback equal to hartland's runtime roster.
    n8n {
      type = native
      url = "http://n8n.middleware:5678"
      healthEndpoint = "/healthz"
      timeout = 5000
    }
    mailpit {
      type = native
      url = "http://mailpit-http.middleware:80"
      healthEndpoint = "/readyz"
      timeout = 5000
    }

    # ──── front ─────────────────────────────────────────────────────────────────────────────────
    iris {
      type = native
      url = "http://iris.kantheon:7012"
      healthEndpoint = "/healthz"
      timeout = 5000
    }

    iris-bff {
      type = native
      url = "http://iris-bff.kantheon:7410"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    # The operated BI tool (olymp platform/bi/superset).
    superset {
      type = native
      url = "http://superset.superset:8088"
      healthEndpoint = "/health"
      timeout = 5000
    }

    # nginx: the SPA fallback answers /healthz with the page, 200.
    landing {
      type = native
      url = "http://landing.kantheon:80"
      healthEndpoint = "/healthz"
      timeout = 5000
    }

    # ──── model ─────────────────────────────────────────────────────────────────────────────────
    veles {
      type = native
      url = "http://veles.ttr-server:7260"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://veles.ttr-server:7260/status"
        adapter = veles
        ok = "model_loaded"
        okValues = ["true"]
        failNote = "no model loaded"
        summary = [
          { k = objects, path = "object_count", kind = count }
          { k = queries, path = "queries_total", kind = count }
        ]
      }
    }

    veles-mcp {
      type = native
      url = "http://veles-mcp.ttr-server:7262"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    translate {
      type = native
      url = "http://translate.ttr-server:7275"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://translate.ttr-server:7275/status"
        at = "last_successful_refresh_timestamp"
        # `stock-v1|<commit>:<hash>` — the commit is the model's; a boot fixture has none.
        commit = "model_version"
        commitPattern = "\\|([0-9a-f]{7,40}):"
        ok = "model_version"
        failValues = ["boot-fixture-v0"]
        failNote = "boot fixture served: no model snapshot loaded yet"
        summary = [
          { k = entities, path = "er_entity_count", kind = count }
          { k = relations, path = "er_relation_count", kind = count }
          { k = queries, path = "saved_query_count", kind = count }
        ]
      }
    }

    # 503 while veles is down.
    validate {
      type = native
      url = "http://validate.ttr-server:7285"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://validate.ttr-server:7285/status"
        commit = "metadata_version"
        commitPattern = "\\|([0-9a-f]{7,40}):"
        ok = "ready"
        okValues = ["true"]
        failNote = "a dependency is down"
        children = "dependencies"
        summary = [
          { k = maxRows, path = "max_top_n", kind = count }
        ]
      }
    }

    query {
      type = native
      url = "http://query.ttr-server:7305"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://query.ttr-server:7305/status"
        summary = [
          { k = worlds, path = "worlds", kind = list }
          { k = activeRuns, path = "active_runs", kind = count }
          { k = cachedPlans, path = "cache.entries", kind = count }
          { k = flightStatements, path = "flight.statements", kind = count }
        ]
      }
    }

    query-mcp {
      type = native
      url = "http://query-mcp.ttr-server:7307"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://query-mcp.ttr-server:7307/status"
        summary = [
          { k = tools, path = "tools", kind = list }
          { k = activeRequests, path = "active_requests", kind = count }
        ]
      }
    }

    # 503 while no worker is healthy.
    dispatch {
      type = native
      url = "http://dispatch.ttr-server:7290"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://dispatch.ttr-server:7290/status"
        summary = [
          { k = workers, path = "healthy_workers", kind = count }
          { k = knownWorkers, path = "known_workers", kind = count }
          { k = connection, path = "default_connection", kind = text }
        ]
      }
    }

    worker-postgres {
      type = native
      url = "http://postgres.ttr-server:7302"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        # Connection ids only; hosts and credentials stay in the worker.
        url = "http://postgres.ttr-server:7302/status"
        summary = [
          { k = connections, path = "supported_connections", kind = list }
          { k = activeQueries, path = "active_queries", kind = count }
        ]
      }
    }

    worker-mssql {
      type = native
      url = "http://mssql.ttr-server:7295"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://mssql.ttr-server:7295/status"
        summary = [
          { k = connections, path = "supported_connections", kind = list }
          { k = activeQueries, path = "active_queries", kind = count }
        ]
      }
    }

    worker-polars {
      type = native
      url = "http://polars.ttr-server:7300"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://polars.ttr-server:7300/status"
        summary = [
          { k = sessions, path = "workspace.sessions", kind = count }
          { k = dataframes, path = "workspace.dfs", kind = count }
        ]
      }
    }

    charon {
      type = native
      url = "http://charon.ttr-server:7250"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://charon.ttr-server:7250/status"
        summary = [
          { k = endpoints, path = "endpoints", kind = text }
          { k = connections, path = "connections#", kind = count }
        ]
      }
    }

    charon-mcp {
      type = native
      url = "http://charon-mcp.kantheon:7252"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    capabilities-mcp {
      type = native
      url = "http://capabilities-mcp.kantheon:7501"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    # ──── understanding ─────────────────────────────────────────────────────────────────────────
    resolver {
      type = native
      url = "http://resolver.ttr-server:7275"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://resolver.ttr-server:7275/status"
        summary = [
          { k = llm, path = "llm", kind = text }
        ]
      }
    }

    # The NLP front; its engines run as their own Deployments (nlp-<engine>), one sub-row each.
    nlp {
      type = native
      url = "http://nlp.ttr-server:7270"
      healthEndpoint = "/readyz"
      timeout = 5000
      status {
        url = "http://nlp.ttr-server:7270/version"
        adapter = nlp
        # morphodita and nametag3 name no readiness path the health service may rely on (no probe on
        # their Deployments either): a TCP connect says "listening", which is all that is claimed.
        probes = [
          { name = "MorphoDiTa", tech = nlp-morphodita, url = "tcp://nlp-morphodita.ttr-server:8080" }
          { name = "NameTag 3", tech = nlp-nametag3, url = "tcp://nlp-nametag3.ttr-server:8001" }
          { name = "spaCy", tech = nlp-spacy, url = "http://nlp-spacy.ttr-server:8091/readyz" }
          { name = "Stanza", tech = nlp-stanza, url = "http://nlp-stanza.ttr-server:8090/readyz" }
        ]
      }
    }

    nlp-mcp {
      type = native
      url = "http://nlp-mcp.ttr-server:7272"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    fuzzy {
      type = native
      url = "http://fuzzy.ttr-server:7265"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    fuzzy-mcp {
      type = native
      url = "http://fuzzy-mcp.ttr-server:7267"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    chrono {
      type = native
      url = "http://chrono.ttr-server:7120"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://chrono.ttr-server:7120/status"
        summary = [
          { k = lexiconTerms, path = "lexicon_slice_terms", kind = count }
          { k = llm, path = "llm_fallback", kind = text }
        ]
      }
    }

    # ──── knowledge ─────────────────────────────────────────────────────────────────────────────
    # DocWH: health only until LH ⚑HL-6 says what their content line is.
    pinakes {
      type = native
      url = "http://pinakes.kantheon:7280"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    kallimachos {
      type = native
      url = "http://kallimachos.kantheon:7260"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    kallimachos-mcp {
      type = native
      url = "http://kallimachos-mcp.kantheon:7262"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    metis {
      type = native
      url = "http://metis.kantheon:7260"
      healthEndpoint = "/readyz"
      timeout = 5000
    }

    metis-mcp {
      type = native
      url = "http://metis-mcp.kantheon:7262"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    # ──── identity ──────────────────────────────────────────────────────────────────────────────
    # Keycloak serves health on its management port (9000), not the public HTTP port.
    keycloak {
      type = native
      url = "http://auth-keycloak-keycloakx-http.auth:9000"
      healthEndpoint = "/health/ready"
      timeout = 5000
    }

    # The identity service (Service `whois`).
    identity {
      type = native
      url = "http://whois.ttr-server:7110"
      healthEndpoint = "/ready"
      timeout = 5000
      status {
        url = "http://whois.ttr-server:7110/ready"
        summary = [
          { k = users, path = "users", kind = count }
        ]
      }
    }

    opa {
      type = native
      url = "http://opa.auth:8181"
      healthEndpoint = "/health"
      timeout = 5000
    }

    llm-gateway {
      type = native
      url = "http://llm-gateway.ttr-server:7280"
      healthEndpoint = "/health/ready"
      timeout = 5000
    }

    # ──── observability ─────────────────────────────────────────────────────────────────────────
    grafana {
      type = native
      url = "http://mon-grafana.monitoring"
      healthEndpoint = "/api/health"
      timeout = 5000
    }

    prometheus {
      type = native
      url = "http://mon-prometheus-server.monitoring"
      healthEndpoint = "/-/healthy"
      timeout = 5000
      status {
        url = "http://mon-prometheus-server.monitoring/api/v1/targets?state=active"
        adapter = prometheus-targets
      }
    }

    loki {
      type = native
      url = "http://mon-loki.monitoring:3100"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    tempo {
      type = native
      url = "http://mon-tempo.monitoring:3200"
      healthEndpoint = "/ready"
      timeout = 5000
    }

    # A DaemonSet; the Service answers from whichever pod it picks.
    alloy {
      type = native
      url = "http://mon-alloy.monitoring:12345"
      healthEndpoint = "/-/ready"
      timeout = 5000
    }

    # ──── data ──────────────────────────────────────────────────────────────────────────────────
    # CNPG: the `-rw` Service follows the primary.
    kantheon-postgres {
      type = tcp
      host = "postgres-rw.data"
      port = 5432
      timeout = 3000
    }

    hartland-pg {
      type = tcp
      host = "hartland-pg-rw.data"
      port = 5432
      timeout = 3000
    }

    kleio-pg {
      type = tcp
      host = "kleio-pg-rw.data"
      port = 5432
      timeout = 3000
    }

    test-pg {
      type = tcp
      host = "test-pg-rw.data"
      port = 5432
      timeout = 3000
    }

    superset-pg {
      type = tcp
      host = "superset-pg-rw.data"
      port = 5432
      timeout = 3000
    }

    backstage-postgres {
      type = tcp
      host = "backstage-postgres-rw.data"
      port = 5432
      timeout = 3000
    }

    mssql-db {
      type = tcp
      host = "mssql.data"
      port = 1433
      timeout = 3000
    }

    redis {
      type = tcp
      host = "redis.data"
      port = 6379
      timeout = 3000
    }

    seaweed {
      type = native
      url = "http://seaweedfs-master.data:9333"
      healthEndpoint = "/cluster/healthz"
      timeout = 5000
    }

    # ──── edge ──────────────────────────────────────────────────────────────────────────────────
    envoy-gateway {
      type = tcp
      host = "envoy-gateway.gateway"
      port = 19001
      timeout = 3000
    }

    argocd {
      type = native
      url = "http://argocd-server.argocd:80"
      healthEndpoint = "/healthz"
      timeout = 5000
    }

    # The operator's webhook connects while the operator runs.
    external-secrets {
      type = tcp
      host = "external-secrets-webhook.auth"
      port = 443
      timeout = 3000
      status {
        # Every ExternalSecret's status (never the Secrets), as the pod's ServiceAccount: the chart's
        # read-only ClusterRole (`rbac.enabled`).
        url = "k8s:/apis/external-secrets.io/v1/externalsecrets"
        adapter = k8s-externalsecrets
      }
    }

    cert-manager {
      type = tcp
      host = "cert-manager-webhook.auth"
      port = 443
      timeout = 3000
      status {
        # Every Certificate's conditions and expiry (never the keys), same ClusterRole.
        url = "k8s:/apis/cert-manager.io/v1/certificates"
        adapter = k8s-certificates
      }
    }

    sealed-secrets {
      type = native
      url = "http://sealed-secrets-controller.auth:8080"
      healthEndpoint = "/healthz"
      timeout = 5000
    }
  }
}
